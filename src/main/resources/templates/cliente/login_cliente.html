<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Cliente | Projeto Salt</title>
    <link rel="stylesheet" th:href="@{/cliente/styles.css}" />
    <style>
        .mensagem { padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center; }
        .erro { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
        .sucesso { background-color: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    </style>
</head>
<body>

    <div class="container">
        <div class="page-header">
            <h1>Login do Cliente</h1>
        </div>

        <div th:if="${param.error}" class="mensagem erro">
            Email ou senha inválidos.
        </div>

        <div th:if="${param.logout}" class="mensagem sucesso">
            Você saiu com sucesso.
        </div>

        <form th:action="@{/clientes/login}" method="post" class="login-form"> 
            
            <div class="form-grid">
                <div class="form-group-2">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required
                           placeholder="seu@email.com">
                </div>

                <div class="form-group-2">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required
                           placeholder="********">
                </div>
            </div>

            <div class="form-actions-main">
                <button type="submit" class="btn btn-primary">
                    Entrar
                </button>
            </div>
        </form>

        <hr />

        <div class="account-links">
            <a th:href="@{/clientes/novo-cadastro}" class="btn-link-secondary">
                Não tem conta? Cadastre-se
            </a>
        </div>

        <div class="account-links">
            <a th:href="@{/clientes/recuperar-senha}" class="btn-link-secondary">
                Esqueceu a senha?
            </a>
        </div>
    </div>

    </body>
</html>
