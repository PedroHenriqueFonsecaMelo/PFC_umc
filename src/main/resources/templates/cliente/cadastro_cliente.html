<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
    
    <link rel="stylesheet" th:href="@{/cliente/styles.css}" />
</head>
<body>

    <div class="container">
        <div class="page-header">
            <h1>Cadastro de Cliente</h1>
        </div>

        <div th:if="${erro}" class="mensagem erro" th:text="${erro}">Mensagem de Erro</div>

        <form id="cadastroForm" th:action="@{/clientes/cadastro}" method="post">
            
            <div class="form-grid">
                <div class="form-group-2">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required
                           th:value="${cliente != null && cliente.nome != null ? cliente.nome : ''}"/>
                </div>

                <div class="form-group-2">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required
                           th:value="${cliente != null && cliente.email != null ? cliente.email : ''}"/>
                </div>

                <div class="form-group-2">
                    <label for="datanasc">Data de Nascimento:</label>
                    <input type="date" id="datanasc" name="datanasc" required
                           th:value="${cliente != null && cliente.datanasc != null ? cliente.datanasc : ''}"/>
                </div>

                <div class="form-group-2">
                    <label for="gen">Gênero:</label>
                    <select id="gen" name="gen" required>
                        <option value="" th:if="${cliente == null or cliente.gen == null}" selected hidden>Selecione</option>
                        <option value="M" th:selected="${cliente != null and cliente.gen == 'M'}">M - Masculino</option>
                        <option value="F" th:selected="${cliente != null and cliente.gen == 'F'}">F - Feminino</option>
                        <option value="OUTRO" th:selected="${cliente != null and cliente.gen == 'OUTRO'}">Outro</option>
                    </select>
                </div>
                
                <div class="form-group-2">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" required
                           th:value="${cliente != null && cliente.cpf != null ? cliente.cpf : ''}"
                           placeholder="Apenas números, 11 dígitos"/>
                </div>
                
                <div class="form-group-2">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required 
                           placeholder="Mínimo 8 caracteres"/>
                </div>
                <div class="form-group-2">
                    <label for="confirmarSenha">Confirmar Senha:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required 
                           placeholder="Repita a Senha"/>
                </div>

            </div> <hr />

            <div class="form-group-checkboxes">
                <label for="termsAccepted">
                    <input type="checkbox" id="termsAccepted" name="termsAccepted" value="true" checked>
                    Aceito os Termos de Serviço
                </label>
                <label for="privacyAccepted">
                    <input type="checkbox" id="privacyAccepted" name="privacyAccepted" value="true" checked>
                    Aceito a Política de Privacidade
                </label>
                
                <p id="senhaErro" class="mensagem erro" style="display:none; margin-top: 15px;">As senhas não conferem!</p>
            </div>

            <div class="form-actions-main">
                <button type="submit" class="btn btn-primary">Cadastrar</button>
            </div>

        </form>
    </div> <script th:src="@{/cliente/script.js}"></script>
    
</body>
</html>
