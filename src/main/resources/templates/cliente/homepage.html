<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Minha Conta - Atualização</title>
        <link rel="stylesheet" th:href="@{/cliente/styles.css}" />
    </head>
    <body>
        <div class="container">

            <div class="page-header">
                <h1>Minha Conta</h1>
                <p th:if="${cliente != null}">
                    Bem-vindo, <strong
                        th:text="${cliente.nome}">Cliente</strong>!
                </p>
            </div>

            <div th:if="${sucesso}" class="mensagem sucesso"
                th:text="${sucesso}"></div>
            <div th:if="${erro}" class="mensagem erro" th:text="${erro}"></div>

            <div th:if="${cliente != null}">
                <!-- FORMULÁRIO PRINCIPAL -->
                <form th:action="@{/clientes/atualizar}" method="post"
                    th:object="${cliente}">
                    <input type="hidden" th:field="*{id}" />

                    <!-- Dados pessoais -->
                    <fieldset class="form-section">
                        <legend>Dados Pessoais</legend>
                        <div class="form-grid">
                            <div class="form-group-2">
                                <label>Nome:</label>
                                <input type="text" th:field="*{nome}"
                                    required />
                            </div>
                            <div class="form-group-2">
                                <label>Email:</label>
                                <input type="email" th:field="*{email}"
                                    required />
                            </div>
                            <div class="form-group-2">
                                <label>CPF:</label>
                                <input type="text" th:field="*{cpf}" readonly />
                            </div>
                            <div class="form-group-2">
                                <label>Data de Nascimento:</label>
                                <input type="date" th:field="*{datanasc}"
                                    required />
                            </div>
                            <div class="form-group-2">
                                <label>Gênero:</label>
                                <input type="text" th:field="*{gen}" />
                            </div>
                            <div class="form-group-2">
                                <label>Nova Senha:</label>
                                <input type="password" th:field="*{senha}"
                                    placeholder="Deixe em branco para manter a senha atual" />
                            </div>
                        </div>
                    </fieldset>

                    <hr />

                    <!-- Endereços -->
                    <h2>Endereços Cadastrados</h2>

                    <div id="enderecos-list-container">
                        <!-- existentes (renderizados pelo Thymeleaf) -->
                        <div th:each="endereco, iStat : *{enderecos}"
                            class="endereco-item item-card">
                            <fieldset>
                                <legend
                                    th:text="'Endereço ' + (${iStat.index} + 1)"></legend>

                                <!-- usa th:field para binding seguro -->
                                <input type="hidden"
                                    th:field="*{enderecos[__${iStat.index}__].id}" />

                                <div class="form-grid">
                                    <div class="form-group">
                                        <label>CEP:</label>
                                        <input type="text"
                                            th:field="*{enderecos[__${iStat.index}__].cep}" />
                                    </div>
                                    <div class="form-group">
                                        <label>Rua:</label>
                                        <input type="text"
                                            th:field="*{enderecos[__${iStat.index}__].rua}" />
                                    </div>
                                    <div class="form-group">
                                        <label>Número:</label>
                                        <input type="text"
                                            th:field="*{enderecos[__${iStat.index}__].numero}" />
                                    </div>
                                    <div class="form-group">
                                        <label>Bairro:</label>
                                        <input type="text"
                                            th:field="*{enderecos[__${iStat.index}__].bairro}" />
                                    </div>
                                    <div class="form-group">
                                        <label>Cidade:</label>
                                        <input type="text"
                                            th:field="*{enderecos[__${iStat.index}__].cidade}" />
                                    </div>
                                    <div class="form-group">
                                        <label>Estado:</label>
                                        <input type="text"
                                            th:field="*{enderecos[__${iStat.index}__].estado}" />
                                    </div>
                                    <div class="form-group">
                                        <label>País:</label>
                                        <input type="text"
                                            th:field="*{enderecos[__${iStat.index}__].pais}" />
                                    </div>
                                    <div class="form-group">
                                        <label>Complemento:</label>
                                        <input type="text"
                                            th:field="*{enderecos[__${iStat.index}__].complemento}" />
                                    </div>
                                    <div class="form-group">
                                        <label>Tipo de residência:</label>
                                        <input type="text"
                                            th:field="*{enderecos[__${iStat.index}__].tipoResidencia}" />
                                    </div>
                                </div>

                                <!-- BOTÃO: remove DO BANCO via controller -->
                                <button type="submit"
                                    formaction="/clientes/removerEndereco"
                                    formmethod="post"
                                    name="enderecoId"
                                    th:value="${endereco.id}"
                                    class="btn-remover-endereco">
                                    🗑️ Remover Endereço (do banco)
                                </button>
                            </fieldset>
                        </div>
                    </div>

                    <div class="form-actions-top">
                        <button type="button" onclick="adicionarEndereco()"
                            class="btn btn-secondary">
                            ➕ Adicionar Novo Endereço
                        </button>
                    </div>

                    <hr />

                    <!-- Cartões -->
                    <h2>Cartões Cadastrados</h2>

                    <div id="cartoes-list-container">
                        <!-- existentes -->
                        <div th:each="cartao, iStat : *{cartoes}"
                            class="cartao-item item-card">
                            <fieldset>
                                <legend
                                    th:text="'Cartão ' + (${iStat.index} + 1)"></legend>

                                <input type="hidden"
                                    th:field="*{cartoes[__${iStat.index}__].id}" />

                                <div class="form-grid">
                                    <div class="form-group">
                                        <label>Número do Cartão:</label>
                                        <input type="text"
                                            th:field="*{cartoes[__${iStat.index}__].numero}"
                                            required />
                                    </div>
                                    <div class="form-group">
                                        <label>Nome no Cartão:</label>
                                        <input type="text"
                                            th:field="*{cartoes[__${iStat.index}__].nomeTitular}"
                                            required />
                                    </div>
                                    <div class="form-group">
                                        <label>CPF do Titular:</label>
                                        <input type="text" readonly
                                            th:field="*{cartoes[__${iStat.index}__].cpfTitular}" />
                                    </div>
                                    <div class="form-group">
                                        <label>Validade:</label>
                                        <input type="text"
                                            th:field="*{cartoes[__${iStat.index}__].validade}"
                                            placeholder="MM/AAAA" />
                                    </div>
                                    <div class="form-group">
                                        <label>Bandeira:</label>
                                        <input type="text"
                                            th:field="*{cartoes[__${iStat.index}__].bandeira}" />
                                    </div>
                                    <div class="form-group">
                                        <label>CVV (oculto):</label>
                                        <input type="text" value="***"
                                            readonly />
                                    </div>
                                </div>

                                <!-- BOTÃO: remove DO BANCO via controller -->
                                <button type="submit"
                                    formaction="/clientes/removerCartao"
                                    formmethod="post"
                                    name="cartaoId"
                                    th:value="${cartao.id}"
                                    class="btn-remover-cartao">
                                    🗑️ Remover Cartão (do banco)
                                </button>
                            </fieldset>
                        </div>
                    </div>

                    <div class="form-actions-top">
                        <button type="button" onclick="adicionarCartao()"
                            class="btn btn-secondary">
                            ➕ Adicionar Novo Cartão
                        </button>
                    </div>

                    <hr />

                    <div class="form-actions-main">
                        <button type="submit" class="btn btn-primary">💾
                            Atualizar Informações</button>
                    </div>
                </form>

                <hr />

                <div class="account-links">
                    <a th:href="@{/clientes/logout}"
                        class="btn-link-secondary">Sair</a>
                    <a th:href="@{|/clientes/deletar|}"
                        class="btn-link-danger-2">Remover conta</a>
                </div>
            </div>
        </div>

        <!-- script externo -->
        <script th:src="@{/cliente/script.js}"></script>

        <!-- inicializadores de índices (usados pelo script) -->
        <script th:inline="javascript">
    /* inicializa contadores com o tamanho atual das listas */
    let enderecoIndex = [[${#lists.isEmpty(cliente.enderecos)} ? 0 : ${#lists.size(cliente.enderecos)}]];
    let cartaoIndex = [[${#lists.isEmpty(cliente.cartoes)} ? 0 : ${#lists.size(cliente.cartoes)}]];
</script>

    </body>
</html>
