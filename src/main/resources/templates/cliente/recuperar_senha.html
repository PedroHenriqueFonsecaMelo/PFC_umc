<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Recuperação de Senha</title>

        <link rel="stylesheet" th:href="@{/css/cliente/styles.css}" />
        <link rel="stylesheet" th:href="@{/css/breadcrumb.css}" />
        <link rel="stylesheet" th:href="@{/css/cliente/bookshelf.css}" />
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            .back-link { color: #000; border-color: #000; }
            .back-link:hover { color: #000; border-color: #000; }
            body {
                background:
                    linear-gradient(rgba(249,246,240,0.82), rgba(249,246,240,0.82)),
                    url('/imagens/prateleira.png') center center / cover no-repeat fixed;
            }
        </style>
    </head>

    <body>
        <a href="/clientes/login" class="back-link">Voltar</a>

        <div class="container">
            <div class="page-header">
                <h1>Recuperação de Senha</h1>
                <p>Informe seu email para receber o link de redefinição.</p>
            </div>

            <!-- Mensagens -->
            <p th:if="${sucesso}" th:text="${sucesso}" class="mensagem sucesso">
            </p>
            <p th:if="${erro}" th:text="${erro}" class="mensagem erro"></p>

            <form th:action="@{/clientes/recuperar-senha}" method="post">
                <div class="form-group">
                    <label for="email">Email cadastrado</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu email"
                        required
                    >
                </div>

                <div class="form-actions-main" style="justify-content: center">
                    <button type="submit" class="btn btn-primary">
                        Enviar link de recuperação
                    </button>
                </div>
            </form>
        </div>

    </body>
</html>
