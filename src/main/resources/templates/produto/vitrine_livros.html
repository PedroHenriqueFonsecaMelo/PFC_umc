<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Vitrine de Livros — Bibliotroca</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap"
            rel="stylesheet"
        >
        <link rel="stylesheet" th:href="@{/css/cliente/nav.css}" />
        <link rel="stylesheet" th:href="@{/css/produto/vitrine.css}" />
    </head>
    <body>
        <div class="toast" id="toastVitrine"></div>

        <!-- NAV -->
        <header th:replace="~{fragments/client-nav :: clientNav}"></header>

        <!-- MAIN -->
        <main class="main-vitrine">
            <div style="margin-bottom: 1.5rem; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.75rem;">
                <div>
                    <h2 id="vitrineTitulo">Livros Disponíveis</h2>
                    <p>Clique em um livro para ver detalhes e adicioná-lo à sua estante.</p>
                </div>
                <button id="btnPromo"
                        onclick="togglePromo()"
                        style="display:flex;align-items:center;gap:.4rem;
                               padding:.5rem 1.1rem;border-radius:20px;
                               border:2px solid #722f37;background:#fff;color:#722f37;
                               font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:600;
                               cursor:pointer;transition:all .18s;">
                    🏷 Ver Promoções
                </button>
            </div>
            <div id="gridLivros"></div>
        </main>

        <script th:src="@{/js/produto/vitrine_livros.js}"></script>
    </body>
</html>
