<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine de Livros — Bibliotroca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink:    #2C241B;
            --paper:  #F9F6F0;
            --cream:  #EDE8DF;
            --accent: #722F37;
            --forest: #4A5D23;
            --white:  #FFFFFF;
            --muted:  #7A6E65;
            --border: rgba(44,36,27,.15);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--paper);
            color: var(--ink);
        }

        /* ── NAV ─────────────────────────────────────────────────── */
        nav.topnav {
            background: var(--ink);
            color: var(--paper);
            padding: .75rem 5vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 30;
        }

        .nav-brand {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            color: var(--paper);
            font-style: italic;
        }

        #saldoUsuario {
            background: rgba(249,246,240,.1);
            padding: .35rem 1rem;
            border: 1px solid rgba(249,246,240,.2);
            border-radius: 8px;
            font-size: .8rem;
            color: #FFD700;
            font-weight: 600;
        }

        /* ── MAIN ────────────────────────────────────────────────── */
        main.main-vitrine {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 5vw;
        }

        main.main-vitrine h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--ink);
            margin-bottom: .35rem;
        }

        main.main-vitrine > p {
            font-style: italic;
            color: var(--muted);
            font-family: 'IM Fell English', serif;
            margin-bottom: 1.5rem;
        }

        #gridLivros {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        /* ── LIVRO CARDS (generated by vitrine_livros.js) ─────── */
        .livro-card {
            background: var(--white);
            border: 1px solid rgba(44,36,27,.12);
            cursor: pointer;
            transition: box-shadow .2s;
            overflow: hidden;
        }

        .livro-card:hover {
            box-shadow: 4px 4px 0 var(--ink);
        }

        .livro-card-img {
            height: 220px;
            background: var(--cream);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            border-bottom: 1px solid rgba(44,36,27,.1);
            overflow: hidden;
        }

        .livro-card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .livro-card-body {
            padding: 1rem;
        }

        .livro-titulo {
            font-family: 'Playfair Display', serif;
            font-size: .9rem;
            font-weight: 700;
            margin-bottom: .25rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .livro-autor {
            font-size: .78rem;
            color: var(--muted);
            font-style: italic;
            margin-bottom: .5rem;
        }

        .livro-preco {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--ink);
        }

        .livro-estado {
            display: inline-block;
            font-size: .7rem;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: .15rem .5rem;
            margin-bottom: .5rem;
        }

        .btn-carrinho {
            width: 100%;
            margin-top: .75rem;
            padding: .6rem;
            background: var(--ink);
            color: var(--paper);
            border: 2px solid var(--ink);
            border-radius: 8px;
            font-size: .72rem;
            font-weight: 600;
            letter-spacing: .1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background .2s, color .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .4rem;
        }

        .btn-carrinho:hover:not(:disabled) {
            background: transparent;
            color: var(--ink);
        }

        .btn-carrinho.no-carrinho {
            background: var(--forest);
            border-color: var(--forest);
            cursor: default;
        }

        .livro-rodape {
            font-size: .7rem;
            color: var(--muted);
            margin-top: .5rem;
        }

        /* ── CARRINHO OVERLAY ────────────────────────────────────── */
        #carrinhoOverlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,.45); z-index: 40;
            backdrop-filter: blur(2px);
        }

        /* ── CARRINHO SIDEBAR ────────────────────────────────────── */
        #carrinhoSidebar {
            position: fixed; top: 0; right: 0; bottom: 0;
            width: 380px; max-width: 95vw;
            background: var(--paper);
            border-left: 2px solid var(--ink);
            box-shadow: -8px 0 40px rgba(0,0,0,.15);
            z-index: 50; display: flex; flex-direction: column;
            transform: translateX(110%);
            transition: transform .3s cubic-bezier(.4,0,.2,1);
        }

        #carrinhoSidebar.aberto { transform: translateX(0); }

        .carr-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid rgba(44,36,27,.12);
        }

        .carr-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--ink);
        }

        .carr-fechar {
            width: 32px; height: 32px;
            background: var(--cream); border: 1px solid var(--border);
            cursor: pointer; font-size: 1rem;
            display: flex; align-items: center; justify-content: center;
            transition: background .2s;
        }

        .carr-fechar:hover { background: var(--cream); filter: brightness(.92); }

        .carr-lista { flex: 1; overflow-y: auto; padding: 1rem 1.5rem; }

        #carrinhoVazio { text-align: center; padding: 3rem 1rem; color: var(--muted); }
        #carrinhoVazio .vazio-icon { font-size: 3rem; margin-bottom: .75rem; }
        #carrinhoVazio p { font-size: .9rem; font-family: 'IM Fell English', serif; font-style: italic; }

        .carr-item {
            display: flex; align-items: center; gap: .875rem;
            padding: .875rem 0; border-bottom: 1px solid rgba(44,36,27,.08);
            animation: slideIn .2s ease;
        }

        @keyframes slideIn { from { opacity:0; transform: translateX(12px); } to { opacity:1; transform:none; } }

        .carr-item-img {
            width: 48px; height: 64px; object-fit: cover;
            background: var(--cream); flex-shrink: 0;
            border: 1px solid var(--border);
        }

        .carr-item-info { flex: 1; min-width: 0; }

        .carr-item-titulo {
            font-family: 'Playfair Display', serif;
            font-size: .875rem; font-weight: 600; color: var(--ink);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .carr-item-autor  { font-size: .75rem; color: var(--muted); margin-top: .1rem; }

        .carr-item-preco  { font-size: .875rem; font-weight: 700; color: var(--accent); margin-top: .25rem; }

        .carr-item-remover {
            width: 28px; height: 28px;
            background: rgba(114,47,55,.08); border: none; cursor: pointer;
            color: var(--accent); font-size: .75rem; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            transition: background .2s;
        }

        .carr-item-remover:hover { background: rgba(114,47,55,.18); }

        .carr-footer {
            padding: 1.25rem 1.5rem;
            border-top: 1px solid rgba(44,36,27,.12);
            background: var(--cream);
        }

        .carr-total-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1rem;
        }

        .carr-total-label { font-size: .875rem; color: var(--muted); }

        .carr-total-valor {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem; font-weight: 800; color: var(--ink);
        }

        #carrinhoAcoes { display: none; flex-direction: column; gap: .5rem; }

        #btnFinalizar {
            width: 100%; padding: .875rem;
            background: var(--ink); color: var(--paper);
            border: 2px solid var(--ink); border-radius: 0;
            font-size: .9375rem; font-weight: 700;
            cursor: pointer; transition: background .2s, border-color .2s;
            font-family: 'DM Sans', sans-serif;
        }

        #btnFinalizar:hover:not(:disabled) {
            background: var(--accent);
            border-color: var(--accent);
        }

        #btnFinalizar:disabled { opacity: .6; cursor: not-allowed; }

        #btnLimpar {
            width: 100%; padding: .625rem;
            background: transparent; color: var(--muted);
            border: 1px solid rgba(44,36,27,.2); border-radius: 0;
            font-size: .8125rem; cursor: pointer; transition: all .2s;
            font-family: 'DM Sans', sans-serif;
        }

        #btnLimpar:hover { border-color: var(--accent); color: var(--accent); }

        @keyframes btnBounce { 0%,100%{transform:scale(1)} 40%{transform:scale(.94)} 70%{transform:scale(1.04)} }
        .btn-bounce { animation: btnBounce .4s ease; }

        #carrinhoContador {
            display: none; position: absolute; top: -6px; right: -6px;
            width: 20px; height: 20px;
            background: var(--accent); color: #fff;
            font-size: .65rem; font-weight: 700;
            align-items: center; justify-content: center;
        }

        /* ── TOASTS ──────────────────────────────────────────────── */
        .toast {
            display: none; position: fixed; bottom: 1.5rem; left: 50%;
            transform: translateX(-50%); padding: .75rem 1.5rem;
            border-radius: 0;
            font-size: .875rem; font-weight: 500; z-index: 99; text-align: center;
            box-shadow: 4px 4px 0 rgba(44,36,27,.15); max-width: 90vw;
            animation: toastIn .25s ease;
        }

        @keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(12px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

        .toast-sucesso { background:#dcfce7; color:#15803d; border:1px solid #bbf7d0; }
        .toast-erro    { background:#fee2e2; color:#b91c1c; border:1px solid #fecaca; }
        .toast-aviso   { background:#fef9c3; color:#854d0e; border:1px solid #fef08a; }
        .toast-info    { background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; }
    </style>
</head>
<body>

    <div id="carrinhoOverlay"></div>
    <div class="toast" id="toastCompra"></div>

    <!-- NAV -->
    <nav class="topnav">
        <a href="/" class="nav-brand" style="text-decoration:none;color:inherit;">Biblio<em>troca</em></a>
        <div style="display:flex;align-items:center;gap:.75rem">
            <a href="/clientes/meu-perfil" style="background:transparent;border:1px solid rgba(249,246,240,.3);color:rgba(249,246,240,.85);padding:.35rem .75rem;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border-radius:8px;">Meu Perfil</a>
            <a href="/livros/vender" style="background:transparent;border:1px solid rgba(249,246,240,.3);color:rgba(249,246,240,.85);padding:.35rem .75rem;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border-radius:8px;">Vender</a>
            <a href="/forum" style="background:transparent;border:1px solid rgba(249,246,240,.3);color:rgba(249,246,240,.85);padding:.35rem .75rem;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border-radius:8px;">Fórum</a>
            <a href="/#blogSection" style="background:transparent;border:1px solid rgba(249,246,240,.3);color:rgba(249,246,240,.85);padding:.35rem .75rem;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border-radius:8px;">Blog</a>
            <a href="/clientes/sair" style="background:transparent;border:1px solid rgba(249,246,240,.3);color:rgba(249,246,240,.85);padding:.35rem .75rem;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border-radius:8px;">Sair</a>
            <div id="saldoUsuario">Carregando saldo...</div>
            <button onclick="toggleCarrinho()" style="background:rgba(249,246,240,.1);border:1px solid rgba(249,246,240,.2);padding:.4rem .75rem;color:#F9F6F0;cursor:pointer;position:relative;border-radius:8px;" title="Minha Estante">
                <img src="/imagens/estante.png" alt="Minha Estante" style="width:66px;height:66px;object-fit:contain;vertical-align:middle"> <span id="carrinhoContador" style="display:none;background:#722F37;color:#fff;font-size:.65rem;font-weight:700;padding:1px 5px;"></span>
            </button>
        </div>
    </nav>

    <!-- MAIN -->
    <main class="main-vitrine">
        <div style="margin-bottom:1.5rem">
            <h2>Livros Disponíveis</h2>
            <p>Adicione à sua estante e finalize sua compra.</p>
        </div>
        <div id="gridLivros"></div>
    </main>

    <!-- ESTANTE SIDEBAR -->
    <div id="carrinhoSidebar">
        <div class="carr-header">
            <h2><img src="/imagens/estante.png" alt="Estante" style="width:72px;height:72px;object-fit:contain;vertical-align:middle;margin-right:.4rem"> Minha Estante</h2>
            <button class="carr-fechar" onclick="fecharCarrinho()">✕</button>
        </div>
        <div class="carr-lista" id="carrinhoLista">
            <div id="carrinhoVazio">
                <div class="vazio-icon"><img src="/imagens/estante.png" alt="Estante vazia" style="width:144px;height:144px;object-fit:contain;opacity:.6"></div>
                <p>Sua estante está vazia.<br>Explore a vitrine e adicione livros!</p>
            </div>
        </div>
        <div class="carr-footer">
            <div class="carr-total-row">
                <span class="carr-total-label">Total</span>
                <span class="carr-total-valor" id="carrinhoTotal">T$ 0,00</span>
            </div>
            <div id="carrinhoAcoes">
                <button id="btnFinalizar" onclick="finalizarCompra()">Finalizar Compra</button>
                <button id="btnLimpar" onclick="limparCarrinho()">Limpar estante</button>
            </div>
        </div>
    </div>

    <script th:src="@{/produto/vitrine_livros.js}"></script>
</body>
</html>
