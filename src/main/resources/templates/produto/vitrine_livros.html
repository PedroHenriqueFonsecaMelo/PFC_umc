<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Vitrine de Livros — Bibliotroca</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=IM+Fell+English:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap"
            rel="stylesheet"
        >
        <link rel="stylesheet" th:href="@{/css/cliente/nav.css}" />
        <link rel="stylesheet" th:href="@{/css/produto/vitrine.css}" />
    </head>
    <body>
        <div class="toast" id="toastVitrine"></div>

        <!-- NAV -->
        <header th:replace="~{fragments/client-nav :: clientNav}"></header>

        <!-- MAIN -->
        <main class="main-vitrine">
            <!-- Cabeçalho: título -->
            <div class="vitrine-header">
                <div>
                    <h2 id="vitrineTitulo">Livros Disponíveis</h2>
                    <p>
                        Clique em um livro para ver detalhes e adicioná-lo à sua
                        estante.
                    </p>
                </div>
            </div>

            <!-- Barra de busca + botão filtros -->
            <div class="vitrine-busca-row">
                <div class="vitrine-search-wrap">
                    <span class="vs-lupa" aria-hidden="true">
                        <svg
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <circle cx="11" cy="11" r="8" />
                            <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        </svg>
                    </span>
                    <input
                        type="text"
                        id="vitrineBusca"
                        class="vitrine-search-input"
                        placeholder="Buscar por título, autor ou ISBN..."
                        autocomplete="off"
                        oninput="onBuscaInput()"
                    >
                    <button
                        id="btnLimparBusca"
                        class="vs-clear"
                        style="display: none"
                        onclick="limparBusca()"
                        aria-label="Limpar busca"
                    >
                        ✕
                    </button>
                </div>
                <button
                    id="btnFiltros"
                    class="btn-abrir-filtros"
                    onclick="toggleFiltros()"
                >
                    <svg
                        class="filtro-funil"
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <polygon
                            points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"
                        />
                    </svg>
                    Filtros <span id="btnFiltrosArrow">▾</span>
                </button>
            </div>

            <!-- Painel de filtros (colapsável) -->
            <div id="painelFiltros" class="painel-filtros">
                <div class="painel-filtros-inner">
                    <div class="filtro-colunas filtro-colunas-4">
                        <!-- Estado físico -->
                        <div class="filtro-grupo">
                            <span class="filtro-label">Estado físico</span>
                            <div class="filtro-checkboxes" id="filtroEstados">
                                <label class="filtro-check-item"><input
                                        type="checkbox"
                                        value="NOVO"
                                    >Novo</label>
                                <label class="filtro-check-item"><input
                                        type="checkbox"
                                        value="OTIMO"
                                    >Ótimo</label>
                                <label class="filtro-check-item"><input
                                        type="checkbox"
                                        value="BOM"
                                    >Bom</label>
                                <label class="filtro-check-item"><input
                                        type="checkbox"
                                        value="REGULAR"
                                    >Regular</label>
                                <label class="filtro-check-item"><input
                                        type="checkbox"
                                        value="RUIM"
                                    >Ruim</label>
                            </div>
                        </div>

                        <div class="filtro-sep" aria-hidden="true"></div>

                        <!-- Faixa de preço -->
                        <div class="filtro-grupo">
                            <span class="filtro-label">Faixa de preço</span>
                            <div class="filtro-preco-stack">
                                <div class="filtro-preco-row">
                                    <span class="filtro-preco-prefix">De</span>
                                    <div class="filtro-preco-input-wrap">
                                        <span class="filtro-preco-moeda"
                                        >T$</span>
                                        <input
                                            type="number"
                                            id="filtroPrecoMin"
                                            class="filtro-preco-input"
                                            min="0"
                                            step="0.01"
                                            placeholder="0"
                                        >
                                    </div>
                                </div>
                                <div class="filtro-preco-row">
                                    <span class="filtro-preco-prefix">Até</span>
                                    <div class="filtro-preco-input-wrap">
                                        <span class="filtro-preco-moeda"
                                        >T$</span>
                                        <input
                                            type="number"
                                            id="filtroPrecoMax"
                                            class="filtro-preco-input"
                                            min="0"
                                            step="0.01"
                                            placeholder="∞"
                                        >
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="filtro-sep" aria-hidden="true"></div>

                        <!-- Gênero -->
                        <div class="filtro-grupo">
                            <span class="filtro-label">Gênero</span>
                            <div
                                class="filtro-checkboxes filtro-generos"
                                id="filtroGeneros"
                            >
                                <!-- preenchido dinamicamente pelo JS -->
                            </div>
                        </div>

                        <div class="filtro-sep" aria-hidden="true"></div>

                        <!-- Ordenação -->
                        <div class="filtro-grupo">
                            <span class="filtro-label">Ordenar por</span>
                            <select id="filtroOrdem" class="filtro-select">
                                <option value="relevancia">Relevância</option>
                                <option value="menor_preco">Menor preço</option>
                                <option value="maior_preco">Maior preço</option>
                                <option value="recente">Mais recente</option>
                                <option value="az">A–Z</option>
                                <option value="za">Z–A</option>
                            </select>
                        </div>
                    </div>
                    <!-- /filtro-colunas -->

                    <!-- Ações -->
                    <div class="filtro-acoes" style="justify-content:space-between;">
                        <button id="btnFiltroPromo" onclick="toggleFiltroPromo()"
                            style="display:inline-flex;align-items:center;gap:0.4rem;
                            padding:0.5rem 1.1rem;border-radius:8px;font-size:0.85rem;
                            font-weight:600;cursor:pointer;transition:all 0.2s;
                            background:#fff;color:#722f37;border:2px solid #722f37;">
                            🏷 Promoções
                        </button>
                        <div style="display:flex;gap:0.5rem;">
                            <button class="btn-limpar" onclick="limparFiltros()">
                                Limpar
                            </button>
                            <button class="btn-aplicar" onclick="lerEAplicarFiltros()">
                                Aplicar filtros
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Linha de chips + contador -->
            <div class="vitrine-meta-row">
                <div id="filtroChips" class="filtro-chips"></div>
                <span id="vitrineContador" class="vitrine-contador"></span>
            </div>

            <!-- Grid de livros -->
            <div id="gridLivros" class="vitrine-grid"></div>

            <!-- Paginação -->
            <div id="vitrinePaginacao" class="pagination"></div>
        </main>

        <script th:src="@{/js/produto/vitrine_livros.js}"></script>
        <script th:src="@{/js/cliente/alerta-endereco.js}"></script>

    <footer>
      <div class="footer-logo">Biblio<em>troca</em></div>
      <p class="footer-copy">© 2025 Bibliotroca — Todos os direitos reservados</p>
    </footer>
    </body>
</html>
