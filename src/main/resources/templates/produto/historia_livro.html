<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>História do Livro — Bibliotroca</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap"
            rel="stylesheet"
        >

        <style>
            *, *::before, *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --ink: #2c241b;
                --paper: #f9f6f0;
                --cream: #ede8df;
                --accent: #722f37;
                --forest: #4a5d23;
                --white: #ffffff;
                --muted: #7a6e65;
                --border: rgba(44, 36, 27, 0.15);
            }

            body {
                background: var(--paper);
                color: var(--ink);
                font-family: "DM Sans", sans-serif;
                padding: 2rem;
                padding-top: 80px;
            }

            nav.topnav {
                background: var(--ink);
                color: var(--paper);
                padding: 0.75rem 5vw;
                display: flex;
                align-items: center;
                justify-content: space-between;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                z-index: 30;
            }

            .nav-link-back {
                font-family: "DM Sans", sans-serif;
                font-size: 0.8rem;
                font-weight: 500;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--paper);
                text-decoration: none;
                border: 1px solid rgba(249, 246, 240, 0.3);
                padding: 0.35rem 0.85rem;
                transition: background 0.2s, color 0.2s;
            }

            .nav-link-back:hover {
                background: var(--paper);
                color: var(--ink);
            }

            .nav-brand {
                font-family: "Playfair Display", serif;
                font-size: 2.4rem;
                font-style: italic;
                color: var(--paper);
                position: absolute;
                left: 50%;
                transform: translateX(-50%);
            }

            .container {
                max-width: 800px;
                margin: 2rem auto;
                background: var(--white);
                padding: 2.5rem;
                border: 1px solid var(--border);
                box-shadow: 4px 4px 0 rgba(44, 36, 27, 0.12);
            }

            #tituloLivro {
                font-family: "Playfair Display", serif;
                font-size: 2.5rem;
                font-weight: 700;
                margin-bottom: 0.5rem;
                line-height: 1.2;
            }

            #autorLivro {
                font-family: "DM Sans", sans-serif;
                font-size: 1.1rem;
                color: var(--muted);
                margin-bottom: 1.5rem;
                font-style: italic;
            }

            #containerCapa {
                margin-bottom: 1.5rem;
                text-align: center;
            }

            #containerCapa img {
                max-width: 200px;
                border: 1px solid var(--border);
                box-shadow: 8px 8px 0 var(--cream);
            }

            #containerResumo {
                font-family: "IM Fell English", serif;
                font-size: 1.15rem;
                line-height: 1.8;
                margin-bottom: 3rem;
                text-align: justify;
            }

            /* Seção de Comentários */
            .opiniao-section {
                border-top: 2px double var(--border);
                padding-top: 2rem;
            }

            .opiniao-section h2 {
                font-family: "Playfair Display", serif;
                margin-bottom: 1.5rem;
            }

            .form-resenha {
                background: var(--paper);
                padding: 1.5rem;
                border: 1px solid var(--border);
                margin-bottom: 2rem;
            }

            .form-resenha textarea {
                width: 100%;
                height: 120px;
                padding: 1rem;
                font-family: "DM Sans", sans-serif;
                border: 1px solid var(--border);
                background: var(--white);
                resize: vertical;
                margin-bottom: 1rem;
            }

            .form-footer {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .btn-enviar {
                background: var(--ink);
                color: var(--paper);
                padding: 0.7rem 1.5rem;
                border: none;
                font-family: "DM Sans", sans-serif;
                font-weight: bold;
                text-transform: uppercase;
                letter-spacing: 1px;
                cursor: pointer;
                transition: opacity 0.2s;
            }

            .btn-enviar:hover {
                opacity: 0.9;
            }

            .resenha-item {
                padding: 1.5rem 0;
                border-bottom: 1px solid var(--border);
            }

            .resenha-header {
                display: flex;
                justify-content: space-between;
                margin-bottom: 0.5rem;
            }

            .stars {
                color: var(--accent);
                letter-spacing: 2px;
            }
        </style>
    </head>
    <body>
        <nav class="topnav">
            <a href="/livros/vitrine" class="nav-link-back">← Vitrine</a>
            <span class="nav-brand">Bibliotroca</span>
        </nav>

        <div class="container">
            <h1 id="tituloLivro">Carregando...</h1>
            <p id="autorLivro">Buscando autor...</p>

            <div id="containerCapa"></div>
            <div id="containerResumo">
                <p>Aguarde enquanto consultamos os arquivos...</p>
            </div>

            <section class="opiniao-section">
                <h2>Vozes dos Leitores</h2>

                <div class="form-resenha">
                    <textarea
                        id="textoComentario"
                        placeholder="O que você achou desta história?"
                    ></textarea>
                    <div class="form-footer">
                        <select
                            id="notaLivro"
                            style="padding: 0.5rem; border: 1px solid var(--border)"
                        >
                            <option value="5">⭐⭐⭐⭐⭐ Excelente</option>
                            <option value="4">⭐⭐⭐⭐ Muito Bom</option>
                            <option value="3">⭐⭐⭐ Bom</option>
                            <option value="2">⭐⭐ Regular</option>
                            <option value="1">⭐ Ruim</option>
                        </select>
                        <button class="btn-enviar" onclick="enviarResenha()">
                            Publicar Resenha
                        </button>
                    </div>
                </div>

                <div id="listaComentarios">
                    <p style="font-style: italic; color: var(--muted)">
                        Nenhuma resenha disponível ainda.
                    </p>
                </div>
            </section>
        </div>

        <div
            id="config-pag"
            th:data-isbn="${isbn}"
            th:data-unificado="${unificado}"
        >
        </div>

        <script th:src="@{/produto/pesquisa_livro.js}" defer></script>
    </body>
</html>
