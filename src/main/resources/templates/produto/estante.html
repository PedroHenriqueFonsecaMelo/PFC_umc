<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Minha Estante — Bibliotroca</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap"
            rel="stylesheet"
        >
        <link rel="stylesheet" th:href="@{/css/cliente/nav.css}" />
        <link rel="stylesheet" th:href="@{/css/produto/estante.css}" />
        <link rel="stylesheet" th:href="@{/css/breadcrumb.css}" />
    </head>
    <body>
        <!-- NAV -->
        <header th:replace="~{fragments/client-nav :: clientNav}"></header>

        <main class="estante-main">

            <!-- NAVEGAÇÃO CONTEXTUAL -->
            <div class="breadcrumb-wrap">
                <nav class="breadcrumb-nav">
                    <a href="/">Início</a>
                    <span class="breadcrumb-sep">›</span>
                    <span class="breadcrumb-current">Minha Estante</span>
                </nav>
                <a href="/livros/vitrine" class="btn-voltar"
                >← Voltar à Vitrine</a>
            </div>
            <!-- Cabeçalho da página -->
            <div class="estante-header">
                <div>
                    <h1>Minha Estante</h1>
                    <p>Selecione os livros que deseja comprar agora.</p>
                    <div class="estante-contadores" id="estanteContadores" style="display:none">
                        <span class="contador-badge" id="contadorTotal">0/20 na estante</span>
                        <span class="contador-badge" id="contadorSelecao">0/5 selecionados para compra</span>
                    </div>
                </div>
            </div>

            <!-- Estado: estante vazia -->
            <div id="estanteVazia" class="estante-vazia" style="display: none">
                <img
                    src="/imagens/estante.png"
                    alt="Estante vazia"
                    onerror="this.style.display='none'"
                    style="width: 100px; height: 100px; object-fit: contain; opacity: 0.5; margin-bottom: 1.2rem"
                >
                <p>Sua estante está vazia.</p>
                <a
                    href="/livros/vitrine"
                    class="btn-primario"
                    style="margin-top: 1rem"
                >Explorar Vitrine</a>
            </div>

            <!-- Conteúdo da estante (com itens) -->
            <div id="estanteConteudo" style="display: none">
                <!-- Barra de ações em lote -->
                <div class="estante-acoes-lote">
                    <div class="estante-acoes-selecao">
                        <button
                            class="btn-remover-selecionados"
                            onclick="selecionarTodos()"
                            id="btnSelecionarTodos"
                        >
                            Selecionar todos
                        </button>
                        <button
                            class="btn-remover-selecionados"
                            onclick="desmarcarTodos()"
                            id="btnDesmarcarTodos"
                            disabled
                        >
                            Desmarcar todos
                        </button>
                    </div>
                    <button
                        class="btn-remover-selecionados"
                        onclick="removerSelecionados()"
                        id="btnRemoverSelecionados"
                        disabled
                    >
                        Remover selecionados
                    </button>
                </div>

                <!-- Lista de livros -->
                <div id="listaEstante" class="estante-lista"></div>

                <!-- Cupom de desconto -->
                <div class="estante-cupom" id="estanteCupom">
                    <div class="cupom-row" id="cupomInputRow">
                        <input
                            type="text"
                            id="cupomCodigo"
                            class="cupom-input"
                            placeholder="Código do cupom"
                            maxlength="30"
                            autocomplete="off"
                            onkeydown="if(event.key==='Enter') aplicarCupom()"
                        >
                        <button
                            class="btn-cupom-aplicar"
                            onclick="aplicarCupom()"
                        >
                            Aplicar
                        </button>
                    </div>
                    <div
                        id="cupomFeedback"
                        class="cupom-feedback"
                        style="display: none"
                    >
                    </div>
                    <div
                        id="cupomAplicadoBloco"
                        class="cupom-aplicado-bloco"
                        style="display: none"
                    >
                    </div>
                </div>

                <!-- Rodapé com subtotal e ação -->
                <div class="estante-footer">
                    <div class="estante-subtotal">
                        <span class="subtotal-label"
                        >Subtotal (<span id="qtdSelecionados">0</span>/5 selecionado(s))</span>
                        <span class="subtotal-valor" id="subtotalValor"
                        >T$ 0,00</span>
                    </div>
                    <button
                        class="btn-prosseguir"
                        id="btnProsseguir"
                        onclick="prosseguirCheckout()"
                        disabled
                    >
                        Prosseguir com selecionados
                    </button>
                </div>
            </div>
        </main>

        <script th:src="@{/js/produto/estante.js}"></script>
        <div class="toast" id="toastEstante"></div>

        <div id="modalConfirmacao" style="display:none;position:fixed;
            inset:0;background:rgba(0,0,0,0.5);z-index:1000;
            align-items:center;justify-content:center;">
            <div style="background:#fff;border-radius:12px;padding:2rem;
                max-width:400px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,0.2);">
                <h3 id="modalConfirmacaoTitulo" style="margin:0 0 0.75rem;
                    font-family:'Playfair Display',serif;font-size:1.2rem;
                    color:#2c241b;"></h3>
                <p id="modalConfirmacaoMensagem" style="margin:0 0 1.5rem;
                    font-size:0.9rem;color:#5a4f47;line-height:1.6;"></p>
                <div style="display:flex;gap:0.75rem;justify-content:flex-end;">
                    <button id="modalConfirmacaoCancelar"
                        style="padding:0.5rem 1.25rem;border:1.5px solid #e0d9d0;
                        border-radius:8px;background:#fff;color:#7a6e65;
                        font-size:0.9rem;cursor:pointer;font-weight:500;">
                        Cancelar
                    </button>
                    <button id="modalConfirmacaoConfirmar"
                        style="padding:0.5rem 1.25rem;border:none;
                        border-radius:8px;background:#722f37;color:#fff;
                        font-size:0.9rem;cursor:pointer;font-weight:600;">
                        Sim, remover
                    </button>
                </div>
            </div>
        </div>
    </body>
</html>
