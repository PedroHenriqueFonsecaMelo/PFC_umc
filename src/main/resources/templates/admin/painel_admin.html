<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Painel Admin — Bibliotroca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    >
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" th:href="@{/css/admin/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/painel.css}" />
    <link rel="stylesheet" th:href="@{/css/breadcrumb.css}" />

    <style>
      .btn-pagination {
        padding: 0.4rem 0.85rem;
        border: 1px solid #e0d9d0;
        background: #fff;
        color: #7a6e65;
        border-radius: 6px;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-weight: 500;
      }
      .btn-pagination:hover:not([disabled]) {
        background: #f9f6f2;
        color: #2c241b;
        border-color: #c5bfb7;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <th:block
        th:replace="~{fragments/admin-sidebar :: adminSidebar('lotes')}"
      ></th:block>

      <div class="content">
        <header class="topbar">
          <div>
            <div class="topbar-title">Painel Admin</div>
            <div class="topbar-date" id="dataHoje"></div>
          </div>
        </header>

        <div class="main">
          <div>
            <div class="tab-panel active" id="panel-lotes">
              <div id="contentArea">
                <div class="loading">Carregando lotes pendentes...</div>
              </div>
            </div>

            <div class="tab-panel" id="panel-pedidos">
              <div class="pedidos-toolbar">
                <div class="pedidos-toolbar-top">
                  <span class="pedidos-heading">Pedidos — Gestão de Envio</span>
                  <button onclick="carregarPedidos()" class="btn-refresh">
                    <i class="fa-solid fa-rotate-right"></i> Atualizar
                  </button>
                </div>
                <div class="pedidos-toolbar-bottom">
                  <div class="filter-bar">
                    <button
                      class="filter-btn active"
                      onclick="filtrarPedidos('TODOS', this)"
                    >
                      Todos
                    </button>
                    <button
                      class="filter-btn"
                      onclick="filtrarPedidos('AGUARDANDO_ENVIO', this)"
                    >
                      ⏳ Aguardando
                    </button>
                    <button
                      class="filter-btn"
                      onclick="filtrarPedidos('EM_TRANSITO', this)"
                    >
                      🚚 Em Trânsito
                    </button>
                    <button
                      class="filter-btn"
                      onclick="filtrarPedidos('ENTREGUE', this)"
                    >
                      ✅ Entregues
                    </button>
                    <button
                      class="filter-btn"
                      onclick="filtrarPedidos('CANCELADO', this)"
                    >
                      ❌ Cancelados
                    </button>
                  </div>
                  <input
                    type="text"
                    id="buscaPedido"
                    placeholder="Buscar por título, comprador ou pedido #..."
                    oninput="renderPedidos()"
                    class="search-input pedidos-search"
                  />
                </div>
              </div>

              <div class="pedidos-table-wrap">
                <table class="pedidos-table">
                  <thead>
                    <tr class="pedidos-thead-tr">
                      <th class="pedidos-th">#</th>
                      <th class="pedidos-th">Livro</th>
                      <th class="pedidos-th">Comprador</th>
                      <th class="pedidos-th">Data</th>
                      <th class="pedidos-th">Total</th>
                      <th class="pedidos-th">Status</th>
                      <th class="pedidos-th" style="text-align: center">
                        Ação
                      </th>
                    </tr>
                  </thead>
                  <tbody id="listaPedidos">
                    <tr>
                      <td colspan="7" class="skel-cell">
                        <div class="skel"></div>
                      </td>
                    </tr>
                    <tr>
                      <td colspan="7" class="skel-cell">
                        <div class="skel"></div>
                      </td>
                    </tr>
                    <tr>
                      <td colspan="7" class="skel-cell">
                        <div class="skel"></div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <div class="tab-panel" id="panel-blog">
              <div
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem"
              >
                <span class="pedidos-heading">Gerenciar Blog</span>
              </div>

              <div class="blog-form-card">
                <div class="blog-section-title">Novo Post</div>
                <form
                  id="formBlog"
                  onsubmit="abrirModalPublicacao(event)"
                  enctype="multipart/form-data"
                >
                  <div style="margin-bottom: 0.75rem">
                    <label>Título</label>
                    <input
                      type="text"
                      id="blogTitulo"
                      name="titulo"
                      required
                      placeholder="Título do post..."
                    />
                  </div>
                  <div style="margin-bottom: 0.75rem">
                    <label>Conteúdo</label>
                    <textarea
                      id="blogConteudo"
                      name="conteudo"
                      required
                      rows="5"
                      placeholder="Escreva o texto do post..."
                    ></textarea>
                  </div>
                  <div style="margin-bottom: 1.25rem">
                    <div
                      style="display: flex; align-items: center; gap: 0.75rem; margin-top: 0.4rem"
                    >
                      <label
                        for="blogImagem"
                        class="btn-publicar"
                        style="cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem"
                      >
                        <i class="fa-solid fa-image"></i> Escolher arquivo
                      </label>
                      <span
                        id="blogImagemNome"
                        style="font-size: 0.8rem; color: #7a6e65; font-style: italic"
                      >Nenhum arquivo selecionado</span>
                    </div>
                    <input
                      type="file"
                      id="blogImagem"
                      name="imagem"
                      accept="image/*"
                      style="display: none"
                      onchange="document.getElementById('blogImagemNome').textContent = this.files[0]?.name || 'Nenhum arquivo selecionado'"
                    />
                    <div id="blogImgPreview" style="margin-top: 0.5rem"></div>
                  </div>
                  <button type="submit" class="btn-publicar">
                    Publicar Post
                  </button>
                  <span
                    id="blogMsg"
                    class="hidden"
                    style="display: none; margin-left: 0.75rem; font-size: 0.875rem; color: #4a5d23"
                  ></span>
                </form>
              </div>

              <div class="blog-section-title" style="margin-bottom: 0.75rem">
                Posts publicados
              </div>
              <div id="listaBlog">
                <div class="skel"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script th:src="@{/js/admin/painel.js}"></script>

    <div
      id="modalConfirmarPublicacao"
      style="display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: 9999; align-items: center; justify-content: center"
    >
      <div
        style="background: #fff; border-radius: 12px; padding: 2rem; max-width: 440px; width: 90%; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2)"
      >
        <h3
          style="margin: 0 0 0.75rem; font-family: 'Playfair Display', serif; font-size: 1.2rem; color: #2c241b"
        >
          Confirmar Publicação
        </h3>
        <div
          id="modalPublicacaoResumo"
          style="margin: 0 0 1.5rem; font-size: 0.88rem; color: #5a4f47; line-height: 1.7; background: #f9f6f2; border-radius: 8px; padding: 1rem"
        >
        </div>
        <div style="display: flex; gap: 0.75rem; justify-content: flex-end">
          <button
            onclick="fecharModalPublicacao()"
            style="padding: 0.5rem 1.25rem; border: 1.5px solid #e0d9d0; border-radius: 8px; background: #fff; color: #7a6e65; font-size: 0.9rem; cursor: pointer; font-weight: 500"
          >
            Cancelar
          </button>
          <button
            id="modalPublicacaoBtnConfirmar"
            style="padding: 0.5rem 1.25rem; border: none; border-radius: 8px; background: #722f37; color: #fff; font-size: 0.9rem; cursor: pointer; font-weight: 600"
          >
            Sim, publicar
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
