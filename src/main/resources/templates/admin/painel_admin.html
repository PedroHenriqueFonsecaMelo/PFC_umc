<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Painel Admin — Bibliotroca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    >
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" th:href="@{/css/admin/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/painel.css}" />
    <link rel="stylesheet" th:href="@{/css/breadcrumb.css}" />
  </head>
  <body>
    <div class="layout">
      <th:block
        th:replace="~{fragments/admin-sidebar :: adminSidebar('lotes')}"
      ></th:block>

      <!-- CONTEÚDO -->
      <div class="content">
        <header class="topbar">
          <div>
            <div class="topbar-title">Painel Admin</div>
            <div class="topbar-date" id="dataHoje"></div>
          </div>
          <div class="topbar-right">
            <span class="badge-online"><span class="dot"></span> Sistema
              Online</span>
            <div class="avatar"><i class="fa-solid fa-user"></i></div>
          </div>
        </header>

        <!-- BREADCRUMB DE LOTE (visível quando auditoria de lote está aberta) -->
        <div id="breadcrumb-lote" class="breadcrumb-wrap" style="display: none">
          <nav class="breadcrumb-nav">
            <a href="/admin/painel">Painel Admin</a>
            <span class="breadcrumb-sep">›</span>
            <a href="#" onclick="loadLotes(); return false;">Lotes Pendentes</a>
            <span class="breadcrumb-sep">›</span>
            <span class="breadcrumb-current" id="bcrLoteNumero">Lote</span>
          </nav>
          <button onclick="loadLotes()" class="btn-voltar">
            ← Voltar para Lotes
          </button>
        </div>

        <div class="main">
          <div>
            <!-- ════ PAINEL LOTES ════ -->
            <div class="tab-panel active" id="panel-lotes">
              <div id="contentArea">
                <div class="loading">Carregando lotes pendentes...</div>
              </div>
            </div>

            <!-- ════ PAINEL PEDIDOS ════ -->
            <div class="tab-panel" id="panel-pedidos">
              <!-- Toolbar de pedidos -->
              <div class="pedidos-toolbar">
                <div class="pedidos-toolbar-top">
                  <span class="pedidos-heading">Pedidos — Gestão de Envio</span>
                  <button onclick="carregarPedidos()" class="btn-refresh">
                    <i class="fa-solid fa-rotate-right"></i> Atualizar
                  </button>
                </div>
                <div class="pedidos-toolbar-bottom">
                  <div class="filter-bar">
                    <button
                      class="filter-btn active"
                      onclick="filtrarPedidos('TODOS', this)"
                    >
                      Todos
                    </button>
                    <button
                      class="filter-btn"
                      onclick="filtrarPedidos('AGUARDANDO_ENVIO', this)"
                    >
                      ⏳ Aguardando
                    </button>
                    <button
                      class="filter-btn"
                      onclick="filtrarPedidos('EM_TRANSITO', this)"
                    >
                      🚚 Em Trânsito
                    </button>
                    <button
                      class="filter-btn"
                      onclick="filtrarPedidos('ENTREGUE', this)"
                    >
                      ✅ Entregues
                    </button>
                    <button
                      class="filter-btn"
                      onclick="filtrarPedidos('CANCELADO', this)"
                    >
                      ❌ Cancelados
                    </button>
                  </div>
                  <input
                    type="text"
                    id="buscaPedido"
                    placeholder="Buscar por título, comprador ou pedido #..."
                    oninput="renderPedidos()"
                    class="search-input pedidos-search"
                  />
                </div>
              </div>

              <div class="pedidos-table-wrap">
                <table class="pedidos-table">
                  <thead>
                    <tr class="pedidos-thead-tr">
                      <th class="pedidos-th">#</th>
                      <th class="pedidos-th">Livro</th>
                      <th class="pedidos-th">Comprador</th>
                      <th class="pedidos-th">Data</th>
                      <th class="pedidos-th">Total</th>
                      <th class="pedidos-th">Status</th>
                      <th class="pedidos-th" style="text-align: center">
                        Ação
                      </th>
                    </tr>
                  </thead>
                  <tbody id="listaPedidos">
                    <tr>
                      <td colspan="7" class="skel-cell">
                        <div class="skel"></div>
                      </td>
                    </tr>
                    <tr>
                      <td colspan="7" class="skel-cell">
                        <div class="skel"></div>
                      </td>
                    </tr>
                    <tr>
                      <td colspan="7" class="skel-cell">
                        <div class="skel"></div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- ════ PAINEL BLOG ════ -->
            <div class="tab-panel" id="panel-blog">
              <div
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem"
              >
                <span class="pedidos-heading">Gerenciar Blog</span>
              </div>

              <!-- Formulário novo post -->
              <div class="blog-form-card">
                <div class="blog-section-title">Novo Post</div>
                <form
                  id="formBlog"
                  onsubmit="abrirModalPublicacao(event)"
                  enctype="multipart/form-data"
                >
                  <div style="margin-bottom: 0.75rem">
                    <label>Título</label>
                    <input
                      type="text"
                      id="blogTitulo"
                      name="titulo"
                      required
                      placeholder="Título do post..."
                    />
                  </div>
                  <div style="margin-bottom: 0.75rem">
                    <label>Conteúdo</label>
                    <textarea
                      id="blogConteudo"
                      name="conteudo"
                      required
                      rows="5"
                      placeholder="Escreva o texto do post..."
                    ></textarea>
                  </div>
                  <div style="margin-bottom: 1.25rem">
                    <label>Imagem (opcional)</label>
                    <input
                      type="file"
                      id="blogImagem"
                      name="imagem"
                      accept="image/*"
                      style="font-size: 0.875rem; color: #7a6e65"
                    />
                    <div id="blogImgPreview" style="margin-top: 0.5rem"></div>
                  </div>
                  <button type="submit" class="btn-publicar">
                    Publicar Post
                  </button>
                  <span
                    id="blogMsg"
                    class="hidden"
                    style="display: none; margin-left: 0.75rem; font-size: 0.875rem; color: #4a5d23"
                  ></span>
                </form>
              </div>

              <!-- Lista de posts existentes -->
              <div class="blog-section-title" style="margin-bottom: 0.75rem">
                Posts publicados
              </div>
              <div id="listaBlog">
                <div class="skel"></div>
              </div>
            </div>
          </div>
          <!-- /page-wrapper -->
        </div>
        <!-- /main-s -->
      </div>
      <!-- /content-wrap -->
    </div>
    <!-- /layout -->

    <script th:src="@{/js/admin/painel.js}"></script>

    <!-- Modal de confirmação de publicação de post -->
    <div id="modalConfirmarPublicacao" style="display:none;position:fixed;
        inset:0;background:rgba(0,0,0,0.5);z-index:9999;
        align-items:center;justify-content:center;">
      <div style="background:#fff;border-radius:12px;padding:2rem;
          max-width:440px;width:90%;
          box-shadow:0 8px 32px rgba(0,0,0,0.2);">
        <h3 style="margin:0 0 0.75rem;
            font-family:'Playfair Display',serif;font-size:1.2rem;
            color:#2c241b;">Confirmar Publicação</h3>
        <div id="modalPublicacaoResumo" style="margin:0 0 1.5rem;
            font-size:0.88rem;color:#5a4f47;line-height:1.7;
            background:#f9f6f2;border-radius:8px;padding:1rem;">
        </div>
        <div style="display:flex;gap:0.75rem;justify-content:flex-end;">
          <button onclick="fecharModalPublicacao()"
              style="padding:0.5rem 1.25rem;
              border:1.5px solid #e0d9d0;border-radius:8px;
              background:#fff;color:#7a6e65;
              font-size:0.9rem;cursor:pointer;font-weight:500;">
            Cancelar
          </button>
          <button id="modalPublicacaoBtnConfirmar"
              style="padding:0.5rem 1.25rem;border:none;
              border-radius:8px;background:#722f37;color:#fff;
              font-size:0.9rem;cursor:pointer;font-weight:600;">
            Sim, publicar
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
