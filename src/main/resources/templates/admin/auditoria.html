<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auditoria — Bibliotroca Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'DM Sans', system-ui, sans-serif; background: #F9F6F0; color: #2C241B; }

    .layout { display: flex; height: 100vh; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar {
      width: 240px; flex-shrink: 0;
      background: #2C241B; color: #F9F6F0;
      display: flex; flex-direction: column; z-index: 30;
    }
    .sidebar-logo {
      display: flex; align-items: center; gap: 10px; padding: 20px;
      border-bottom: 1px solid rgba(249,246,240,0.08);
    }
    .sidebar-logo .icon { font-size: 22px; }
    .sidebar-logo .name {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700; font-size: 30px; line-height: 1.2; color: #F9F6F0;
    }
    .sidebar-logo .sub  { font-size: 11px; color: rgba(249,246,240,0.4); }
    .sidebar-nav { flex: 1; padding: 12px 10px; overflow-y: auto; }
    .nav-label {
      font-size: 10px; font-weight: 700; color: rgba(249,246,240,0.3);
      letter-spacing: .12em; text-transform: uppercase;
      padding: 0 8px; margin-bottom: 8px; display: block;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: 10px; margin-bottom: 2px;
      font-size: 13px; font-weight: 500; text-decoration: none;
      color: rgba(249,246,240,0.55);
      transition: background .15s, color .15s;
    }
    .nav-item i { width: 16px; text-align: center; }
    .nav-item:hover { background: rgba(249,246,240,0.06); color: #F9F6F0; }
    .nav-item.ativo  { background: #722F37; color: #F9F6F0; }
    .sidebar-footer  { padding: 10px; border-top: 1px solid rgba(249,246,240,0.08); }
    .nav-item.sair:hover { background: rgba(114,47,55,0.2); color: #e8a0a8; }

    .content { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

    /* ── Topbar ── */
    .topbar {
      background: #FFFFFF; border-bottom: 1px solid rgba(74,93,35,0.12);
      padding: 14px 24px; display: flex; align-items: center;
      justify-content: space-between; flex-shrink: 0;
    }
    .topbar-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700; font-size: 17px; color: #2C241B;
    }
    .topbar-date  { font-size: 11px; color: rgba(44,36,27,0.45); margin-top: 2px; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .badge-online {
      display: flex; align-items: center; gap: 6px;
      background: rgba(74,93,35,0.08); color: #4A5D23;
      font-size: 11px; font-weight: 600;
      padding: 5px 12px; border-radius: 999px; border: 1px solid rgba(74,93,35,0.2);
    }
    .badge-online .dot { width: 7px; height: 7px; background: #4A5D23; border-radius: 50%; }
    .avatar {
      width: 36px; height: 36px; background: #722F37;
      border-radius: 50%; display: flex; align-items: center;
      justify-content: center; color: #F9F6F0; font-size: 13px;
    }

    .main { flex: 1; overflow-y: auto; padding: 24px; }

    /* ── Section label ── */
    .section-label {
      font-size: 10px; font-weight: 700; color: rgba(44,36,27,0.45);
      text-transform: uppercase; letter-spacing: .14em; margin-bottom: 14px;
    }

    /* ── Tabela card ── */
    .table-card {
      background: #FFFFFF; border-radius: 16px;
      border: 1px solid rgba(74,93,35,0.1);
      box-shadow: 0 1px 4px rgba(44,36,27,0.05); overflow: hidden;
    }

    /* Linha de acento topo */
    .table-card::before {
      content: '';
      display: block; height: 3px;
      background: linear-gradient(90deg, #722F37 0%, #4A5D23 60%, transparent 100%);
    }

    table { width: 100%; border-collapse: collapse; }
    thead { background: #F9F6F0; }
    th {
      padding: 12px 16px; text-align: left;
      font-size: 11px; font-weight: 700; color: rgba(44,36,27,0.5);
      text-transform: uppercase; letter-spacing: .08em;
      border-bottom: 1px solid rgba(74,93,35,0.12);
    }
    td {
      padding: 12px 16px; font-size: 13px; color: #2C241B;
      border-bottom: 1px solid rgba(249,246,240,0.9); vertical-align: top;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #F9F6F0; }

    /* Coluna #  */
    td:first-child { color: rgba(44,36,27,0.35); font-size: 12px; }

    /* Badge de ação — alterna verde/vinho por índice par/ímpar */
    .badge-acao {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 600;
      background: rgba(114,47,55,0.1); color: #722F37;
      border: 1px solid rgba(114,47,55,0.2);
      white-space: nowrap;
    }

    /* Usuário / ID */
    .user-name { font-weight: 600; color: #2C241B; }
    .user-id   { font-size: 11px; color: rgba(44,36,27,0.4); margin-top: 2px; }

    /* Data */
    td.col-data { white-space: nowrap; color: rgba(44,36,27,0.55); font-size: 12px; }

    .empty-state {
      padding: 56px; text-align: center; color: rgba(44,36,27,0.4);
      font-size: 14px;
    }
    .empty-state i { font-size: 38px; display: block; margin-bottom: 12px; color: rgba(114,47,55,0.3); }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(114,47,55,0.2); border-radius: 999px; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { padding: 16px; }
    }
  </style>
</head>
<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <a href="/" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
        <span class="icon">📚</span>
        <div><div class="name">Bibliotroca</div><div class="sub">Painel Administrativo</div></div>
      </a>
    </div>
    <nav class="sidebar-nav">
      <span class="nav-label">Menu</span>
      <a href="/admin/dashboard" class="nav-item"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <a href="/admin/painel"    class="nav-item"><i class="fa-solid fa-box-open"></i> Lotes Pendentes</a>
      <a href="/admin/painel"    class="nav-item"><i class="fa-solid fa-truck"></i> Pedidos / Envio</a>
      <a href="/admin/painel"    class="nav-item"><i class="fa-solid fa-pen-to-square"></i> Blog</a>
      <a href="/forum"           class="nav-item"><i class="fa-solid fa-comments"></i> Fórum</a>
      <a href="/admin/audit"     class="nav-item ativo"><i class="fa-solid fa-shield-halved"></i> Auditoria</a>
    </nav>
    <div class="sidebar-footer">
      <a href="/admin/sair" class="nav-item sair"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
    </div>
  </aside>

  <!-- CONTEÚDO -->
  <div class="content">
    <header class="topbar">
      <div>
        <div class="topbar-title">Auditoria</div>
        <div class="topbar-date" id="dataHoje"></div>
      </div>
      <div class="topbar-right">
        <span class="badge-online"><span class="dot"></span> Sistema Online</span>
        <div class="avatar"><i class="fa-solid fa-user"></i></div>
      </div>
    </header>

    <div class="main">
      <div class="section-label">Logs de Acesso e Atividade</div>

      <div class="table-card">

        <div th:if="${#lists.isEmpty(logs)}" class="empty-state">
          <i class="fa-solid fa-shield-halved"></i>
          Nenhum log registrado até o momento.
        </div>

        <table th:if="${!#lists.isEmpty(logs)}">
          <thead>
            <tr>
              <th>#</th>
              <th>Ação</th>
              <th>Usuário</th>
              <th>Detalhes</th>
              <th>Data / Hora</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="log, stat : ${logs}">
              <td th:text="${stat.count}"></td>
              <td><span class="badge-acao" th:text="${log.acao}"></span></td>
              <td>
                <div class="user-name" th:text="${log.emailUsuario}"></div>
                <div class="user-id" th:text="${'ID: ' + log.idUsuario}"></div>
              </td>
              <td th:text="${log.detalhes}"></td>
              <td class="col-data" th:text="${log.dataHora}"></td>
            </tr>
          </tbody>
        </table>

      </div>
    </div>
  </div>

</div>

<script>
  const d = new Date();
  document.getElementById('dataHoje').textContent =
    d.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
</script>

</body>
</html>
