<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auditoria — Bibliotroca Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="stylesheet" th:href="@{/css/admin/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/auditoria.css}" />
  </head>
  <body>
    <div class="layout">
      <th:block th:replace="~{fragments/admin-sidebar :: adminSidebar('auditoria')}"></th:block>

      <!-- CONTEÚDO -->
      <div class="content">
        <header class="topbar">
          <div>
            <div class="topbar-title">Auditoria</div>
            <div class="topbar-date" id="dataHoje"></div>
          </div>
          <div class="topbar-right">
            <span class="badge-online"><span class="dot"></span> Sistema
              Online</span>
            <div class="avatar"><i class="fa-solid fa-user"></i></div>
          </div>
        </header>

        <div class="main">
          <div class="section-label">Logs de Acesso e Atividade</div>

          <div class="table-card">
            <div th:if="${#lists.isEmpty(logs)}" class="empty-state">
              <i class="fa-solid fa-shield-halved"></i>
              Nenhum log registrado até o momento.
            </div>

            <table th:if="${!#lists.isEmpty(logs)}">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Ação</th>
                  <th>Usuário</th>
                  <th>Detalhes</th>
                  <th>Data / Hora</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="log, stat : ${logs}">
                  <td th:text="${stat.count}"></td>
                  <td>
                    <span class="badge-acao" th:text="${log.acao}"></span>
                  </td>
                  <td>
                    <div class="user-name" th:text="${log.emailUsuario}"></div>
                    <div class="user-id" th:text="${'ID: ' + log.idUsuario}">
                    </div>
                  </td>
                  <td th:text="${log.detalhes}"></td>
                  <td class="col-data" th:text="${log.dataHora}"></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script th:src="@{/js/admin/auditoria.js}"></script>
  </body>
</html>
