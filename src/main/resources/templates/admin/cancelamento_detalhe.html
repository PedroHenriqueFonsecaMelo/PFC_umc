<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cancelamento — Bibliotroca Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/css/admin/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/cancelamento_detalhe.css}" />
    <script th:inline="javascript">
        window._SOLICITACAO_ID = /*[[${solicitacaoId}]]*/ null;
    </script>
  </head>
  <body>
    <div class="layout">
      <th:block th:replace="~{fragments/admin-sidebar :: adminSidebar('cancelamentos')}"></th:block>

      <div class="overlay" id="overlay" onclick="fecharMenu()"></div>

      <div class="content">
        <header class="topbar">
          <div style="display:flex;align-items:center;gap:14px">
            <button class="menu-btn" onclick="abrirMenu()">
              <i class="fa-solid fa-bars"></i>
            </button>
            <div>
              <div class="topbar-title" id="topbarTitle">Cancelamento</div>
              <div class="topbar-date" id="dataHoje"></div>
            </div>
          </div>
          <div class="topbar-right">
            <span class="badge-online"><span class="dot"></span> Sistema Online</span>
            <div class="avatar"><i class="fa-solid fa-user"></i></div>
          </div>
        </header>

        <!-- CONTEÚDO DINÂMICO -->
        <div id="pageContent">
          <div class="loading-placeholder">
            <i class="fa-solid fa-spinner fa-spin"></i> Carregando solicitação...
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL RECUSA -->
    <div class="modal-overlay" id="modalOverlay" onclick="fecharModal()"></div>
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2>Recusar Cancelamento</h2>
        <button class="modal-close" onclick="fecharModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div class="modal-info" id="modalInfo"></div>
        <div class="form-group">
          <label for="comentarioAdmin">Comentário para o cliente <span style="color:#7a6e65;font-weight:400">(opcional)</span></label>
          <textarea id="comentarioAdmin" rows="4" placeholder="Ex: O pedido já foi encaminhado ao transportador e não pode ser cancelado..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-modal-sec" onclick="fecharModal()">Cancelar</button>
        <button class="btn-modal-confirm" id="btnConfirmarRecusa" onclick="confirmarRecusa()">
          <i class="fa-solid fa-xmark"></i> Confirmar Recusa
        </button>
      </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast" style="display:none"></div>

    <script th:src="@{/js/admin/cancelamento_detalhe.js}"></script>
  </body>
</html>
