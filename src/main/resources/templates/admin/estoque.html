<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão de Livros — Bibliotroca Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" th:href="@{/css/admin/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/estoque.css}" />
  </head>
  <body>
    <div class="layout">
      <th:block
        th:replace="~{fragments/admin-sidebar :: adminSidebar('estoque')}"
      ></th:block>

      <div class="overlay" id="overlay" onclick="fecharMenu()"></div>

      <div class="content">
        <header class="topbar">
          <div style="display: flex; align-items: center; gap: 14px">
            <button class="menu-btn" onclick="abrirMenu()">
              <i class="fa-solid fa-bars"></i>
            </button>
            <div>
              <div class="topbar-title">Gestão de Livros</div>
              <div class="topbar-date" id="dataHoje"></div>
            </div>
          </div>
          <div class="topbar-right">
            <span class="badge-online"><span class="dot"></span> Sistema
              Online</span>
            <div class="avatar"><i class="fa-solid fa-user"></i></div>
          </div>
        </header>

        <!-- BARRA DE AÇÕES -->
        <div class="estoque-toolbar">
          <div class="estoque-search-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
              type="text"
              id="searchInput"
              placeholder="Buscar por título, autor ou ISBN..."
              oninput="aplicarFiltrosEstoque()"
            />
          </div>
          <div class="estoque-contador" id="contadorLivros">— livros</div>
          <button class="btn-add" onclick="abrirModalAdd()">
            <i class="fa-solid fa-plus"></i> Adicionar Livro
          </button>
        </div>

        <!-- BARRA DE FILTROS AVANÇADOS -->
        <div style="display:flex;align-items:center;gap:.75rem;padding:.75rem 1.25rem;
            border-top:1px solid rgba(44,36,27,.08);flex-wrap:wrap;">

            <button onclick="toggleFiltrosEstoque()" id="btnFiltrosEstoque"
                style="display:inline-flex;align-items:center;gap:.5rem;
                padding:.45rem 1rem;border:1.5px solid rgba(44,36,27,.2);
                border-radius:8px;background:#fff;font-size:.82rem;
                color:#2c241b;cursor:pointer;font-family:'DM Sans',sans-serif;
                font-weight:600;transition:all .2s;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <line x1="4" y1="6" x2="20" y2="6"/>
                    <line x1="8" y1="12" x2="16" y2="12"/>
                    <line x1="10" y1="18" x2="14" y2="18"/>
                </svg>
                Filtros
                <span id="filtrosEstoqueBadge" style="display:none;background:#722f37;
                    color:#fff;border-radius:20px;padding:.1rem .45rem;
                    font-size:.7rem;font-weight:700;"></span>
            </button>

            <!-- Pills dos filtros ativos -->
            <div id="filtrosEstoquePills" style="display:flex;gap:.4rem;flex-wrap:wrap;"></div>
        </div>

        <!-- Painel de filtros colapsável -->
        <div id="filtrosEstoquePanel" style="display:none;padding:1.25rem;
            border-top:1px solid rgba(44,36,27,.08);background:#faf8f5;">
            <div style="display:grid;grid-template-columns:repeat(3,1fr);
                gap:1rem;margin-bottom:1rem;">

                <div>
                    <label style="font-size:.72rem;font-weight:700;text-transform:uppercase;
                        letter-spacing:.06em;color:#9c968f;display:block;margin-bottom:.4rem;">
                        Estado
                    </label>
                    <select id="filtroEstoqueEstado" onchange="aplicarFiltrosEstoque()"
                        style="width:100%;padding:.5rem .75rem;border:1.5px solid #e0d9d0;
                        border-radius:8px;font-size:.85rem;background:#fff;
                        color:#2c241b;font-family:'DM Sans',sans-serif;">
                        <option value="">Todos os estados</option>
                        <option value="NOVO">Novo</option>
                        <option value="OTIMO">Ótimo</option>
                        <option value="BOM">Bom</option>
                        <option value="DESGASTADO">Desgastado</option>
                        <option value="RUIM">Ruim</option>
                    </select>
                </div>

                <div>
                    <label style="font-size:.72rem;font-weight:700;text-transform:uppercase;
                        letter-spacing:.06em;color:#9c968f;display:block;margin-bottom:.4rem;">
                        Promoção
                    </label>
                    <select id="filtroEstoquePromo" onchange="aplicarFiltrosEstoque()"
                        style="width:100%;padding:.5rem .75rem;border:1.5px solid #e0d9d0;
                        border-radius:8px;font-size:.85rem;background:#fff;
                        color:#2c241b;font-family:'DM Sans',sans-serif;">
                        <option value="">Todos</option>
                        <option value="sim">Em promoção</option>
                        <option value="nao">Sem promoção</option>
                    </select>
                </div>

                <div>
                    <label style="font-size:.72rem;font-weight:700;text-transform:uppercase;
                        letter-spacing:.06em;color:#9c968f;display:block;margin-bottom:.4rem;">
                        Preço (T$)
                    </label>
                    <div style="display:flex;gap:.5rem;align-items:center;">
                        <input id="filtroEstoquePrecoMin" type="number" placeholder="Mínimo"
                            oninput="aplicarFiltrosEstoque()"
                            style="width:100%;padding:.5rem .75rem;border:1.5px solid #e0d9d0;
                            border-radius:8px;font-size:.85rem;font-family:'DM Sans',sans-serif;">
                        <span style="color:#9c968f;font-size:.85rem;">–</span>
                        <input id="filtroEstoquePrecoMax" type="number" placeholder="Máximo"
                            oninput="aplicarFiltrosEstoque()"
                            style="width:100%;padding:.5rem .75rem;border:1.5px solid #e0d9d0;
                            border-radius:8px;font-size:.85rem;font-family:'DM Sans',sans-serif;">
                    </div>
                </div>
            </div>

            <div style="display:flex;justify-content:flex-end;">
                <button onclick="limparFiltrosEstoque()"
                    style="padding:.45rem 1.25rem;background:transparent;
                    border:1.5px solid rgba(44,36,27,.2);border-radius:8px;
                    font-size:.82rem;color:#7a6e65;cursor:pointer;
                    font-family:'DM Sans',sans-serif;font-weight:600;">
                    Limpar todos os filtros
                </button>
            </div>
        </div>

        <!-- TABELA DE LIVROS -->
        <div class="estoque-table-wrap">
          <table class="estoque-table" id="estoqueGrid">
            <thead>
              <tr>
                <th style="width: 48px">#</th>
                <th>Livro</th>
                <th>ISBN</th>
                <th>Estado</th>
                <th>Preço</th>
                <th>Promoção</th>
                <th style="width: 160px">Ações</th>
              </tr>
            </thead>
            <tbody id="estoqueBody">
              <tr class="skeleton-row"><td colspan="7"></td></tr>
              <tr class="skeleton-row"><td colspan="7"></td></tr>
              <tr class="skeleton-row"><td colspan="7"></td></tr>
            </tbody>
          </table>
        </div>

        <div id="estoqueVazio" class="estoque-vazio" style="display: none">
          <i class="fa-solid fa-box-open"></i>
          <p>Nenhum livro no estoque.</p>
        </div>
      </div>
    </div>

    <!-- ════ MODAL ADD / EDIT ════ -->
    <div class="modal-overlay" id="modalOverlay" onclick="fecharModal()"></div>
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modalTitulo">Adicionar Livro</h2>
        <button class="modal-close" onclick="fecharModal()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <form id="modalForm" onsubmit="salvarLivro(event)">
        <input type="hidden" id="livroId" />

        <!-- ISBN é o PRIMEIRO campo: busca automática ao digitar (≥10 dígitos) -->
        <div class="form-group">
          <label>ISBN</label>
          <input
            type="text"
            id="fIsbn"
            placeholder="Ex: 978-3-16-148410-0"
            oninput="buscarIsbnModal()"
            onkeydown="if(event.key==='Enter'){event.preventDefault();buscarIsbnModal();}"
          />
          <span
            id="fIsbnStatus"
            style="display: none; font-size: 0.76rem; color: #7a6e65; margin-top: 0.3rem"
          >
          </span>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Título *</label>
            <input
              type="text"
              id="fTitulo"
              required
              placeholder="Ex: Dom Casmurro"
            />
          </div>
          <div class="form-group">
            <label>Autor *</label>
            <input
              type="text"
              id="fAutor"
              required
              placeholder="Ex: Machado de Assis"
            />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Preço (T$) *</label>
            <input
              type="number"
              id="fPreco"
              required
              min="0"
              step="0.01"
              placeholder="Ex: 30.00"
              oninput="calcularPrecoPromo()"
            />
          </div>
          <div class="form-group">
            <label>Estado *</label>
            <select id="fEstado" required>
              <option value="NOVO">Novo</option>
              <option value="OTIMO">Ótimo</option>
              <option value="BOM" selected>Bom</option>
              <option value="DESGASTADO">Desgastado</option>
              <option value="RUIM">Ruim</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Resumo / Descrição</label>
          <textarea
            id="fResumo"
            rows="3"
            placeholder="Breve descrição do livro..."
          ></textarea>
        </div>
        <div class="form-group">
          <label>Gênero</label>
          <select id="fGenero">
            <option value="">— Detectar automaticamente via ISBN —</option>
            <option value="Ficção">Ficção</option>
            <option value="Ficção Científica">Ficção Científica</option>
            <option value="Fantasia">Fantasia</option>
            <option value="Infantojuvenil">Infantojuvenil</option>
            <option value="Jovem Adulto">Jovem Adulto</option>
            <option value="Mistério">Mistério</option>
            <option value="Suspense">Suspense</option>
            <option value="Terror">Terror</option>
            <option value="Romance">Romance</option>
            <option value="Ficção Histórica">Ficção Histórica</option>
            <option value="Aventura">Aventura</option>
            <option value="Biografia">Biografia</option>
            <option value="História">História</option>
            <option value="Filosofia">Filosofia</option>
            <option value="Psicologia">Psicologia</option>
            <option value="Autoajuda">Autoajuda</option>
            <option value="Negócios">Negócios</option>
            <option value="Ciências">Ciências</option>
            <option value="Tecnologia">Tecnologia</option>
            <option value="Computação">Computação</option>
            <option value="Arte">Arte</option>
            <option value="Poesia">Poesia</option>
            <option value="Drama">Drama</option>
            <option value="Quadrinhos">Quadrinhos</option>
            <option value="Literatura">Literatura</option>
            <option value="Não-ficção">Não-ficção</option>
            <option value="Culinária">Culinária</option>
            <option value="Esportes">Esportes</option>
            <option value="Humor">Humor</option>
            <option value="Religião">Religião</option>
            <option value="Política">Política</option>
            <option value="Direito">Direito</option>
            <option value="Medicina">Medicina</option>
            <option value="Educação">Educação</option>
          </select>
          <span
            style="font-size: 0.75rem; color: #7a6e65; margin-top: 0.25rem; display: block"
          >
            Deixe em branco para detectar automaticamente pelo ISBN via Google
            Books.
          </span>
        </div>

        <!-- ── FOTOS ── -->
        <div class="form-group">
          <label>Fotos do livro
            <small
              style="font-weight: 400; color: #7a6e65; margin-left: 0.35rem"
            >até 3 imagens · JPG, PNG ou WebP</small>
          </label>
          <div class="modal-fotos-grid" id="modalFotosGrid"></div>
          <input
            type="file"
            id="modalFotoInput"
            accept="image/jpeg,image/jpg,image/png,image/webp"
            multiple
            style="display: none"
            onchange="handleModalFotos(this.files)"
          />
        </div>

        <!-- ── PROMOÇÃO ── -->
        <div class="form-divider">Promoção</div>
        <div class="form-group form-check-inline">
          <label class="check-label">
            <input type="checkbox" id="fEmPromocao" onchange="togglePromo()" />
            Em promoção
          </label>
        </div>
        <div id="promoSection" style="display: none">
          <div class="form-row">
            <div class="form-group">
              <label>Desconto (%)</label>
              <input
                type="number"
                id="fDesconto"
                min="1"
                max="99"
                step="1"
                placeholder="Ex: 20"
                oninput="calcularPrecoPromo()"
              />
            </div>
            <div class="form-group">
              <label>Preço promocional (T$)</label>
              <input
                type="text"
                id="fPrecoPromo"
                readonly
                placeholder="Calculado automaticamente"
                style="background: #f5f1eb; color: #722f37; font-weight: 600"
              />
            </div>
          </div>
          <div class="form-group">
            <label>Validade da promoção</label>
            <input
              type="text"
              id="fPromoExpira"
              placeholder="DD/MM/AAAA HH:MM"
              maxlength="16"
              autocomplete="off"
              oninput="mascaraDataHora(this)"
              style="font-variant-numeric: tabular-nums; letter-spacing: 0.04em"
            />
            <span
              id="fPromoExpiraErro"
              style="display: none; font-size: 0.75rem; color: #c0392b; margin-top: 0.25rem; display: none"
            ></span>
          </div>
        </div>

        <div id="modalErro" class="modal-erro" style="display: none"></div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="fecharModal()">
            Cancelar
          </button>
          <button type="submit" class="btn-save" id="btnSalvar">Salvar</button>
        </div>
      </form>
    </div>

    <!-- ════ MODAL CONFIRMAR EXCLUSÃO ════ -->
    <div id="confirmModal" style="display:none;position:fixed;
        inset:0;background:rgba(0,0,0,0.5);z-index:9999;
        align-items:center;justify-content:center;">
        <div style="background:#fff;border-radius:12px;padding:2rem;
            max-width:400px;width:90%;
            box-shadow:0 8px 32px rgba(0,0,0,0.2);">
            <h3 style="margin:0 0 0.75rem;
                font-family:'Playfair Display',serif;font-size:1.2rem;
                color:#2c241b;">Confirmar exclusão</h3>
            <p id="confirmMsg" style="margin:0 0 1.5rem;font-size:0.9rem;
                color:#5a4f47;line-height:1.6;"></p>
            <div style="display:flex;gap:0.75rem;justify-content:flex-end;">
                <button id="btnCancelDelete"
                    onclick="fecharConfirm()"
                    style="padding:0.5rem 1.25rem;
                    border:1.5px solid #e0d9d0;border-radius:8px;
                    background:#fff;color:#7a6e65;
                    font-size:0.9rem;cursor:pointer;font-weight:500;">
                    Cancelar
                </button>
                <button id="btnConfirmDelete"
                    style="padding:0.5rem 1.25rem;border:none;
                    border-radius:8px;background:#722f37;color:#fff;
                    font-size:0.9rem;cursor:pointer;font-weight:600;">
                    Sim, excluir
                </button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/admin/estoque.js}"></script>
  </body>
</html>
