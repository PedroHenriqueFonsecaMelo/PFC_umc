<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disparo de E-mails — Bibliotroca Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="stylesheet" th:href="@{/css/admin/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/notificacoes.css}" />
  </head>
  <body>
    <div class="layout">
      <th:block
        th:replace="~{fragments/admin-sidebar :: adminSidebar('notificacoes')}"
      ></th:block>

      <div class="content">
        <header class="topbar">
          <div>
            <div class="topbar-title">Disparo de E-mails</div>
            <div class="topbar-date" id="dataHoje"></div>
          </div>
          <div class="topbar-right">
            <span class="badge-online"><span class="dot"></span> Sistema
              Online</span>
            <div class="avatar"><i class="fa-solid fa-user"></i></div>
          </div>
        </header>

        <div class="main">
          <div class="section-label">Filtrar usuários e compor mensagem</div>

          <div class="notif-grid">
            <!-- COLUNA ESQUERDA: filtros + composição -->
            <div style="display: flex; flex-direction: column; gap: 20px">
              <!-- Card: Filtros -->
              <div class="notif-card">
                <div class="notif-card-title">
                  <i class="fa-solid fa-filter"></i> Destinatários
                </div>

                <label class="notif-label">Critério de filtro</label>
                <select class="notif-select" id="filtro" onchange="onFiltroChange()">
                  <option value="todos">Todos os usuários</option>
                  <option value="ranking_maior">Maior ranking (XP)</option>
                  <option value="ranking_menor">Menor ranking (XP)</option>
                  <option value="tokens_maior">Mais tokens na carteira</option>
                  <option value="tokens_menor">Menos tokens na carteira</option>
                  <option value="mais_antigos">Usuários mais antigos</option>
                  <option value="mais_novos">Usuários mais recentes</option>
                  <option value="emails_especificos">E-mails específicos</option>
                </select>

                <div id="campoEmailsEspecificos" style="display:none;margin-top:0.5rem;">
                  <label class="notif-label">E-mails dos destinatários</label>
                  <textarea class="notif-textarea" id="emailsEspecificos"
                    placeholder="Digite os e-mails separados por vírgula"
                    style="min-height:80px;"></textarea>
                </div>

                <label class="notif-label">Quantidade máxima</label>
                <select class="notif-select" id="limite">
                  <option value="999999">Todos (sem limite)</option>
                  <option value="10">Top 10</option>
                  <option value="25">Top 25</option>
                  <option value="50">Top 50</option>
                  <option value="100">Top 100</option>
                </select>
              </div>

              <!-- Card: Composição do e-mail -->
              <div class="notif-card">
                <div class="notif-card-title">
                  <i class="fa-solid fa-pen-nib"></i> Compor E-mail
                </div>

                <label class="notif-label">Assunto</label>
                <input
                  type="text"
                  class="notif-input"
                  id="assunto"
                  placeholder="Ex: Novidades da Bibliotroca!"
                />

                <label class="notif-label">Mensagem</label>
                <textarea
                  class="notif-textarea"
                  id="corpo"
                  placeholder="Escreva aqui o conteúdo do e-mail..."
                ></textarea>

                <label class="notif-label">Agendar envio (opcional)</label>
                <input
                  type="text"
                  class="notif-input"
                  id="agendamento"
                  placeholder="DD/MM/AAAA HH:MM"
                  maxlength="16"
                  autocomplete="off"
                  oninput="mascaraDataHora(this)"
                />
                <span class="notif-hint"
                >Deixe em branco para envio imediato.</span>

                <div class="notif-actions">
                  <button class="btn-notif-send" onclick="disparar(false)">
                    <i class="fa-solid fa-paper-plane"></i> Enviar agora
                  </button>
                  <button class="btn-notif-schedule" onclick="disparar(true)">
                    <i class="fa-solid fa-clock"></i> Agendar
                  </button>
                </div>
              </div>
            </div>

            <!-- COLUNA DIREITA: histórico de e-mails -->
            <div class="notif-card">
              <div class="preview-header">
                <div class="notif-card-title" style="margin-bottom: 0">
                  <i class="fa-solid fa-clock-rotate-left"></i> Histórico de
                  E-mails
                </div>
              </div>

              <div class="preview-table-wrap">
                <table class="preview-table">
                  <thead>
                    <tr>
                      <th>Data</th>
                      <th>Assunto</th>
                      <th>Destinatários</th>
                      <th>Tipo</th>
                      <th>Agendado para</th>
                      <th>Ações</th>
                    </tr>
                  </thead>
                  <tbody id="historicoBody">
                    <tr>
                      <td colspan="6" class="preview-empty">
                        Carregando histórico...
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
          <!-- /notif-grid -->
        </div>
        <!-- /main -->
      </div>
      <!-- /content -->
    </div>
    <!-- /layout -->

    <!-- Toast de feedback -->
    <div class="notif-toast" id="toast"></div>

    <!-- Modal de detalhes do e-mail -->
    <div id="modalDetalhes" style="display:none;position:fixed;inset:0;
        background:rgba(0,0,0,0.45);z-index:1000;align-items:center;justify-content:center;">
      <div style="background:#fff;border-radius:12px;padding:2rem;max-width:560px;
          width:92%;box-shadow:0 8px 32px rgba(0,0,0,0.2);max-height:85vh;overflow-y:auto;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;">
          <h3 style="margin:0;font-family:'Playfair Display',serif;font-size:1.15rem;color:#2c241b;">
            Detalhes do E-mail
          </h3>
          <button onclick="fecharModalDetalhes()"
              style="background:none;border:none;cursor:pointer;font-size:1.2rem;color:#7a6e65;line-height:1;">✕</button>
        </div>
        <div id="modalDetalhesCorpo"></div>
      </div>
    </div>

    <script>
      // Topbar date
      const dataHoje = document.getElementById("dataHoje");
      if (dataHoje) {
        const now = new Date();
        dataHoje.textContent = now.toLocaleDateString("pt-BR", {
          weekday: "long",
          day: "2-digit",
          month: "long",
          year: "numeric",
        });
      }

      function mostrarToast(msg, cor) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.style.display = "block";
        t.style.background = cor || "#2c241b";
        setTimeout(() => {
          t.style.display = "none";
        }, 5000);
      }

      // ── Máscara de data/hora DD/MM/AAAA HH:MM ────────────────────────────────
      function mascaraDataHora(el) {
        let v = el.value.replace(/\D/g, "").slice(0, 12);
        if (v.length > 10) {
          v = v.replace(/(\d{2})(\d{2})(\d{4})(\d{2})(\d{0,2})/, "$1/$2/$3 $4:$5");
        } else if (v.length > 8) {
          v = v.replace(/(\d{2})(\d{2})(\d{4})(\d{0,2})/, "$1/$2/$3 $4");
        } else if (v.length > 4) {
          v = v.replace(/(\d{2})(\d{2})(\d{0,4})/, "$1/$2/$3");
        } else if (v.length > 2) v = v.replace(/(\d{2})(\d{0,2})/, "$1/$2");
        el.value = v;
      }

      // ── Mostrar/ocultar campo de e-mails específicos ─────────────────────────
      function onFiltroChange() {
        const filtro = document.getElementById("filtro").value;
        const campo = document.getElementById("campoEmailsEspecificos");
        if (campo) campo.style.display = filtro === "emails_especificos" ? "block" : "none";
      }

      // ── Modal de detalhes ─────────────────────────────────────────────────────
      function abrirDetalhes(e) {
        const tipo = e.tipo === "AGENDADO"
          ? '<span style="background:rgba(13,148,136,.12);color:#0f766e;font-size:.75rem;font-weight:700;padding:.2rem .5rem;border-radius:4px;">Agendado</span>'
          : '<span style="background:rgba(74,93,35,.12);color:#4a5d23;font-size:.75rem;font-weight:700;padding:.2rem .5rem;border-radius:4px;">Imediato</span>';
        document.getElementById("modalDetalhesCorpo").innerHTML = `
          <div style="display:flex;flex-direction:column;gap:0.75rem;font-size:.88rem;color:#2c241b;">
            <div><span style="font-weight:700;color:#7a6e65;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;">Data e hora</span><div style="margin-top:.2rem;">${e.dataRegistro}</div></div>
            <div><span style="font-weight:700;color:#7a6e65;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;">Assunto</span><div style="margin-top:.2rem;font-weight:600;">${e.assunto}</div></div>
            <div><span style="font-weight:700;color:#7a6e65;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;">Destinatários</span><div style="margin-top:.2rem;">${e.quantidadeDestinatarios} usuário(s)</div></div>
            <div><span style="font-weight:700;color:#7a6e65;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;">Tipo</span><div style="margin-top:.2rem;">${tipo}${e.agendadoPara ? ' — ' + e.agendadoPara : ''}</div></div>
            <div><span style="font-weight:700;color:#7a6e65;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;">Filtro aplicado</span><div style="margin-top:.2rem;">${e.filtro}</div></div>
            <div><span style="font-weight:700;color:#7a6e65;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;">Conteúdo</span><div style="margin-top:.2rem;white-space:pre-wrap;background:#f9f6f0;border-radius:8px;padding:.75rem;border:1px solid #e0d9d0;line-height:1.6;">${e.corpo}</div></div>
          </div>`;
        document.getElementById("modalDetalhes").style.display = "flex";
      }

      function fecharModalDetalhes() {
        document.getElementById("modalDetalhes").style.display = "none";
      }

      document.addEventListener("click", function(ev) {
        const modal = document.getElementById("modalDetalhes");
        if (ev.target === modal) fecharModalDetalhes();
      });

      // ── Histórico de e-mails ──────────────────────────────────────────────────
      function carregarHistorico() {
        const tbody = document.getElementById("historicoBody");
        tbody.innerHTML =
          '<tr><td colspan="6" class="preview-empty">Carregando...</td></tr>';

        fetch("/admin/notificacoes/historico")
          .then((r) => r.json())
          .then((data) => {
            if (!data.length) {
              tbody.innerHTML =
                '<tr><td colspan="6" class="preview-empty">Nenhum e-mail enviado ainda.</td></tr>';
              return;
            }
            tbody.innerHTML = data.map((e, idx) => {
              const tipo = e.tipo === "AGENDADO"
                ? '<span style="background:rgba(13,148,136,.12);color:#0f766e;font-size:.72rem;font-weight:700;padding:.15rem .45rem;border-radius:4px;">Agendado</span>'
                : '<span style="background:rgba(74,93,35,.12);color:#4a5d23;font-size:.72rem;font-weight:700;padding:.15rem .45rem;border-radius:4px;">Imediato</span>';
              const agendadoPara = e.agendadoPara
                ? `<span style="font-size:.78rem;">${e.agendadoPara}</span>`
                : '<span style="color:#b0a49a;">—</span>';
              const assuntoTrunc = e.assunto.length > 40
                ? e.assunto.substring(0, 40) + "…"
                : e.assunto;
              const corpoPreview = e.corpo.length > 60
                ? e.corpo.substring(0, 60) + "…"
                : e.corpo;
              const key = "_email_" + idx;
              window[key] = e;
              return `<tr>
                <td style="white-space:nowrap;font-size:.78rem;">${e.dataRegistro}</td>
                <td>
                  <div style="font-weight:600;font-size:.82rem;">${assuntoTrunc}</div>
                  <div style="font-size:.72rem;color:#7a6e65;margin-top:.15rem;">${corpoPreview}</div>
                </td>
                <td style="text-align:center;font-weight:700;">${e.quantidadeDestinatarios}</td>
                <td>${tipo}</td>
                <td>${agendadoPara}</td>
                <td style="text-align:center;">
                  <button onclick="abrirDetalhes(window['${key}'])"
                      style="background:none;border:1px solid #e0d9d0;border-radius:6px;
                      padding:.25rem .65rem;font-size:.75rem;cursor:pointer;color:#2c241b;
                      font-weight:600;transition:background .15s;"
                      onmouseover="this.style.background='#f3f0eb'"
                      onmouseout="this.style.background='none'">Detalhes</button>
                </td>
              </tr>`;
            }).join("");
          })
          .catch(() => {
            tbody.innerHTML =
              '<tr><td colspan="6" class="preview-empty">Erro ao carregar histórico.</td></tr>';
            mostrarToast("Erro ao buscar histórico.", "#b91c1c");
          });
      }

      // ── Disparar / agendar ────────────────────────────────────────────────────
      function disparar(comAgendamento) {
        const filtro = document.getElementById("filtro").value;
        const limite = parseInt(document.getElementById("limite").value);
        const assunto = document.getElementById("assunto").value.trim();
        const corpo = document.getElementById("corpo").value.trim();
        const agendamento = document.getElementById("agendamento").value.trim();

        if (!assunto) {
          mostrarToast("Preencha o assunto do e-mail.", "#b45309");
          return;
        }
        if (!corpo) {
          mostrarToast("Preencha a mensagem do e-mail.", "#b45309");
          return;
        }
        if (comAgendamento && !agendamento) {
          mostrarToast("Informe a data e hora para agendamento.", "#b45309");
          return;
        }

        const emailsRaw = document.getElementById("emailsEspecificos")?.value || "";
        const emailsEspecificos = filtro === "emails_especificos"
          ? emailsRaw.split(",").map(e => e.trim()).filter(e => e.length > 0)
          : [];

        if (filtro === "emails_especificos" && emailsEspecificos.length === 0) {
          mostrarToast("Informe pelo menos um e-mail.", "#b45309");
          return;
        }

        const payload = {
          filtro,
          limite,
          assunto,
          corpo,
          agendamento: comAgendamento ? agendamento : "",
          emailsEspecificos,
        };

        fetch("/admin/notificacoes/disparar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        })
          .then((r) => r.json())
          .then((data) => {
            mostrarToast(data.mensagem, "#2c6e49");
            carregarHistorico();
          })
          .catch(() => mostrarToast("Erro ao processar o disparo.", "#b91c1c"));
      }

      // Carrega histórico ao abrir a página
      document.addEventListener("DOMContentLoaded", carregarHistorico);
    </script>
  </body>
</html>
