<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clientes — Bibliotroca Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" th:href="@{/css/admin/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/clientes.css}" />
  </head>
  <body>
    <div class="layout">
      <th:block
        th:replace="~{fragments/admin-sidebar :: adminSidebar('clientes')}"
      ></th:block>

      <div class="overlay" id="overlay" onclick="fecharMenu()"></div>

      <div class="content">
        <header class="topbar">
          <div style="display: flex; align-items: center; gap: 14px">
            <button class="menu-btn" onclick="abrirMenu()">
              <i class="fa-solid fa-bars"></i>
            </button>
            <div>
              <div class="topbar-title">Clientes</div>
              <div class="topbar-date" id="dataHoje"></div>
            </div>
          </div>
        </header>

        <!-- HEADER -->
        <div class="page-header">
          <div>
            <div class="page-title">Gestão de Clientes</div>
            <div class="page-subtitle" id="totalLabel">Carregando...</div>
          </div>
        </div>

        <!-- TOOLBAR -->
        <div class="toolbar">
          <div class="toolbar-left">
            <div class="search-box">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input
                type="text"
                id="busca"
                placeholder="Buscar por nome ou e-mail..."
                oninput="aplicarFiltros()"
              />
            </div>
            <div class="filter-tabs">
              <button
                class="filter-tab ativo"
                data-filtro="todos"
                onclick="setFiltro('todos')"
              >
                Todos
              </button>
              <button
                class="filter-tab"
                data-filtro="ativos"
                onclick="setFiltro('ativos')"
              >
                Ativos
              </button>
              <button
                class="filter-tab"
                data-filtro="inativos"
                onclick="setFiltro('inativos')"
              >
                Inativos
              </button>
              <button
                class="filter-tab"
                data-filtro="suspensos"
                onclick="setFiltro('suspensos')"
              >
                Suspensos
              </button>
            </div>
          </div>
          <div class="toolbar-right">
            <button class="btn-refresh" onclick="carregarDados()">
              <i class="fa-solid fa-rotate-right"></i> Atualizar
            </button>
          </div>
        </div>

        <!-- Barra de filtros profissional -->
        <div style="display:flex;align-items:center;gap:.75rem;padding:.75rem 1.25rem;
            border-top:1px solid rgba(44,36,27,.08);flex-wrap:wrap;">

            <button onclick="toggleFiltros()" id="btnFiltros"
                style="display:inline-flex;align-items:center;gap:.5rem;
                padding:.45rem 1rem;border:1.5px solid rgba(44,36,27,.2);
                border-radius:8px;background:#fff;font-size:.82rem;
                color:#2c241b;cursor:pointer;font-family:'DM Sans',sans-serif;
                font-weight:600;transition:all .2s;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <line x1="4" y1="6" x2="20" y2="6"/>
                    <line x1="8" y1="12" x2="16" y2="12"/>
                    <line x1="10" y1="18" x2="14" y2="18"/>
                </svg>
                Filtros
                <span id="filtrosBadge" style="display:none;background:#722f37;
                    color:#fff;border-radius:20px;padding:.1rem .45rem;
                    font-size:.7rem;font-weight:700;"></span>
            </button>

            <!-- Pills dos filtros ativos -->
            <div id="filtrosPills" style="display:flex;gap:.4rem;flex-wrap:wrap;"></div>
        </div>

        <!-- Painel de filtros colapsável -->
        <div id="filtrosPanel" style="display:none;padding:1.25rem;
            border-top:1px solid rgba(44,36,27,.08);
            background:#faf8f5;">
            <div style="display:grid;grid-template-columns:repeat(3,1fr);
                gap:1rem;margin-bottom:1rem;">

                <div>
                    <label style="font-size:.72rem;font-weight:700;text-transform:uppercase;
                        letter-spacing:.06em;color:#9c968f;display:block;margin-bottom:.4rem;">
                        Nível
                    </label>
                    <select id="filtroNivel" onchange="aplicarFiltros()"
                        style="width:100%;padding:.5rem .75rem;border:1.5px solid #e0d9d0;
                        border-radius:8px;font-size:.85rem;background:#fff;
                        color:#2c241b;font-family:'DM Sans',sans-serif;">
                        <option value="">Todos os níveis</option>
                        <option value="INICIANTE">Iniciante</option>
                        <option value="BRONZE">Bronze</option>
                        <option value="PRATA">Prata</option>
                        <option value="OURO">Ouro</option>
                        <option value="PLATINA">Platina</option>
                    </select>
                </div>

                <div>
                    <label style="font-size:.72rem;font-weight:700;text-transform:uppercase;
                        letter-spacing:.06em;color:#9c968f;display:block;margin-bottom:.4rem;">
                        Saldo Tokens
                    </label>
                    <div style="display:flex;gap:.5rem;align-items:center;">
                        <input id="filtroSaldoMin" type="number" placeholder="Mínimo"
                            oninput="aplicarFiltros()"
                            style="width:100%;padding:.5rem .75rem;border:1.5px solid #e0d9d0;
                            border-radius:8px;font-size:.85rem;font-family:'DM Sans',sans-serif;">
                        <span style="color:#9c968f;font-size:.85rem;">–</span>
                        <input id="filtroSaldoMax" type="number" placeholder="Máximo"
                            oninput="aplicarFiltros()"
                            style="width:100%;padding:.5rem .75rem;border:1.5px solid #e0d9d0;
                            border-radius:8px;font-size:.85rem;font-family:'DM Sans',sans-serif;">
                    </div>
                </div>

                <div>
                    <label style="font-size:.72rem;font-weight:700;text-transform:uppercase;
                        letter-spacing:.06em;color:#9c968f;display:block;margin-bottom:.4rem;">
                        Compras
                    </label>
                    <div style="display:flex;gap:.5rem;align-items:center;">
                        <input id="filtroComprasMin" type="number" placeholder="Mínimo"
                            oninput="aplicarFiltros()"
                            style="width:100%;padding:.5rem .75rem;border:1.5px solid #e0d9d0;
                            border-radius:8px;font-size:.85rem;font-family:'DM Sans',sans-serif;">
                        <span style="color:#9c968f;font-size:.85rem;">–</span>
                        <input id="filtroComprasMax" type="number" placeholder="Máximo"
                            oninput="aplicarFiltros()"
                            style="width:100%;padding:.5rem .75rem;border:1.5px solid #e0d9d0;
                            border-radius:8px;font-size:.85rem;font-family:'DM Sans',sans-serif;">
                    </div>
                </div>

                <div>
                    <label style="font-size:.72rem;font-weight:700;text-transform:uppercase;
                        letter-spacing:.06em;color:#9c968f;display:block;margin-bottom:.4rem;">
                        Cupons Usados
                    </label>
                    <div style="display:flex;gap:.5rem;align-items:center;">
                        <input id="filtroCuponsMin" type="number" placeholder="Mínimo"
                            oninput="aplicarFiltros()"
                            style="width:100%;padding:.5rem .75rem;border:1.5px solid #e0d9d0;
                            border-radius:8px;font-size:.85rem;font-family:'DM Sans',sans-serif;">
                        <span style="color:#9c968f;font-size:.85rem;">–</span>
                        <input id="filtroCuponsMax" type="number" placeholder="Máximo"
                            oninput="aplicarFiltros()"
                            style="width:100%;padding:.5rem .75rem;border:1.5px solid #e0d9d0;
                            border-radius:8px;font-size:.85rem;font-family:'DM Sans',sans-serif;">
                    </div>
                </div>

                <div>
                    <label style="font-size:.72rem;font-weight:700;text-transform:uppercase;
                        letter-spacing:.06em;color:#9c968f;display:block;margin-bottom:.4rem;">
                        Cadastro entre
                    </label>
                    <div style="display:flex;gap:.5rem;align-items:center;">
                        <input id="filtroCadastroInicio" type="date"
                            onchange="aplicarFiltros()"
                            style="width:100%;padding:.5rem .5rem;border:1.5px solid #e0d9d0;
                            border-radius:8px;font-size:.82rem;font-family:'DM Sans',sans-serif;">
                        <span style="color:#9c968f;font-size:.85rem;">–</span>
                        <input id="filtroCadastroFim" type="date"
                            onchange="aplicarFiltros()"
                            style="width:100%;padding:.5rem .5rem;border:1.5px solid #e0d9d0;
                            border-radius:8px;font-size:.82rem;font-family:'DM Sans',sans-serif;">
                    </div>
                </div>
            </div>

            <div style="display:flex;justify-content:flex-end;">
                <button onclick="limparFiltrosAvancados()"
                    style="padding:.45rem 1.25rem;background:transparent;
                    border:1.5px solid rgba(44,36,27,.2);border-radius:8px;
                    font-size:.82rem;color:#7a6e65;cursor:pointer;
                    font-family:'DM Sans',sans-serif;font-weight:600;">
                    Limpar todos os filtros
                </button>
            </div>
        </div>

        <!-- TABELA -->
        <div class="table-area">
          <div class="table-card" id="tableCard">
            <div class="loading-placeholder">
              <i class="fa-solid fa-spinner fa-spin"></i> Carregando clientes...
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" style="display: none"></div>

    <script th:src="@{/js/admin/clientes.js}"></script>
  </body>
</html>
