<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil do Cliente — Bibliotroca Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" th:href="@{/css/admin/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/clientes_perfil.css}" />
    <link rel="stylesheet" th:href="@{/css/breadcrumb.css}" />
    <script th:inline="javascript">
      window._CLIENTE_ID = /*[[${clienteId}]]*/ null;
    </script>
  </head>
  <body>
    <div class="layout">
      <th:block
        th:replace="~{fragments/admin-sidebar :: adminSidebar('clientes')}"
      ></th:block>

      <div class="overlay" id="overlay" onclick="fecharMenu()"></div>

      <div class="content" id="mainContent">
        <header class="topbar">
          <div style="display: flex; align-items: center; gap: 14px">
            <button class="menu-btn" onclick="abrirMenu()">
              <i class="fa-solid fa-bars"></i>
            </button>
            <div>
              <div class="topbar-title" id="topbarTitle">Perfil do Cliente</div>
              <div class="topbar-date" id="dataHoje"></div>
            </div>
          </div>
        </header>

        <!-- NAVEGAÇÃO CONTEXTUAL -->
        <div class="breadcrumb-wrap">
          <nav class="breadcrumb-nav">
            <a href="/admin/painel">Painel Admin</a>
            <span class="breadcrumb-sep">›</span>
            <a href="/admin/clientes">Clientes</a>
            <span class="breadcrumb-sep">›</span>
            <span class="breadcrumb-current" id="bcrNomeCliente"
            >Carregando...</span>
          </nav>
          <a href="/admin/clientes" class="btn-voltar"
          >← Voltar para Clientes</a>
        </div>

        <!-- CONTEÚDO DINÂMICO -->
        <div id="perfilContent">
          <div class="loading-placeholder" style="margin-top: 60px">
            <i class="fa-solid fa-spinner fa-spin"></i> Carregando perfil...
          </div>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" style="display: none"></div>

    <script th:src="@{/js/admin/clientes_perfil.js}"></script>
  </body>
</html>
