<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>
        <!--
  Fragment: adminSidebar(activeMenu)
  Uso: <th:block th:replace="~{fragments/admin-sidebar :: adminSidebar('dashboard')}"></th:block>
  Valores de activeMenu: dashboard | lotes | cancelamentos | pedidos | clientes | estoque | cupons | blog | forum | auditoria | notificacoes | reportes
-->
        <aside
            th:fragment="adminSidebar(activeMenu)"
            class="sidebar"
            id="sidebar"
        >
            <div class="sidebar-logo">
                <a
                    href="/"
                    style="display: flex; align-items: center; gap: 10px; text-decoration: none"
                >
                    <div>
                        <div class="sidebar-name">Bibliotroca</div>
                        <div class="sidebar-sub">Painel Administrativo</div>
                    </div>
                </a>
            </div>
            <script th:src="@{/js/admin/global-search.js}"></script>
            <div style="padding:0 1rem 1rem;position:relative;">
                <div style="position:relative;">
                    <svg style="position:absolute;left:10px;top:50%;transform:translateY(-50%);
                        opacity:.5;" width="14" height="14" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input id="globalSearch" type="text" placeholder="Buscar clientes ou livros..."
                        oninput="globalSearchInput(this.value)"
                        autocomplete="off"
                        style="width:100%;padding:.5rem .75rem .5rem 2rem;
                        background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
                        border-radius:8px;color:#fff;font-size:.8rem;
                        font-family:'DM Sans',sans-serif;box-sizing:border-box;outline:none;">
                </div>
                <!-- Dropdown de resultados -->
                <div id="globalSearchResults" style="display:none;position:absolute;
                    left:1rem;right:1rem;top:100%;background:#fff;border-radius:8px;
                    box-shadow:0 8px 32px rgba(0,0,0,.18);z-index:9999;
                    max-height:400px;overflow-y:auto;overscroll-behavior:contain;border:1px solid #e0d9d0;">
                </div>
            </div>

            <nav class="sidebar-nav">
                <span class="nav-label">Menu</span>
                <a
                    href="/admin/dashboard"
                    class="nav-item"
                    th:classappend="${activeMenu == 'dashboard'} ? ' ativo'"
                >
                    <i class="fa-solid fa-gauge"></i> Dashboard
                </a>
                <a
                    href="/admin/painel"
                    class="nav-item"
                    th:classappend="${activeMenu == 'lotes'} ? ' ativo'"
                >
                    <i class="fa-solid fa-box-open"></i> Lotes Pendentes
                </a>
                <a
                    href="/admin/painel?tab=pedidos"
                    class="nav-item"
                    th:classappend="${activeMenu == 'pedidos'} ? ' ativo'"
                >
                    <i class="fa-solid fa-truck"></i> Pedidos / Envio
                </a>
                <a
                    href="/admin/cancelamentos"
                    class="nav-item"
                    id="navCancelamentos"
                    th:classappend="${activeMenu == 'cancelamentos'} ? ' ativo'"
                    style="display: flex; align-items: center; justify-content: space-between"
                >
                    <i class="fa-solid fa-ban"></i>
                    <span style="flex: 1; display: flex; align-items: center; justify-content: space-between">
                        Cancelamentos
                        <span
                            id="badgeCancelamentos"
                            style="display: none; background: #c0392b; color: #fff; font-size: 0.68rem; font-weight: 700; padding: 1px 7px; border-radius: 20px; min-width: 18px; text-align: center; line-height: 1.6"
                        >0</span>
                    </span>
                </a>
                <div style="height:1px;background:rgba(255,255,255,0.08);margin:0.4rem 1rem;"></div>
                <a
                    href="/admin/clientes"
                    class="nav-item"
                    th:classappend="${activeMenu == 'clientes'} ? ' ativo'"
                >
                    <i class="fa-solid fa-users"></i> Gestão de Clientes
                </a>
                <a
                    href="/admin/livros"
                    class="nav-item"
                    th:classappend="${activeMenu == 'estoque'} ? ' ativo'"
                >
                    <i class="fa-solid fa-warehouse"></i> Gestão de Livros
                </a>
                <a
                    href="/admin/cupons"
                    class="nav-item"
                    th:classappend="${activeMenu == 'cupons'} ? ' ativo'"
                >
                    <i class="fa-solid fa-ticket"></i> Cupons
                </a>
                <div style="height:1px;background:rgba(255,255,255,0.08);margin:0.4rem 1rem;"></div>
                <a
                    href="/admin/painel?tab=blog"
                    class="nav-item"
                    th:classappend="${activeMenu == 'blog'} ? ' ativo'"
                >
                    <i class="fa-solid fa-pen-to-square"></i> Blog
                </a>
                <a
                    href="/forum"
                    class="nav-item"
                    th:classappend="${activeMenu == 'forum'} ? ' ativo'"
                >
                    <i class="fa-solid fa-comments"></i> Fórum
                </a>
                <div style="height:1px;background:rgba(255,255,255,0.08);margin:0.4rem 1rem;"></div>
                <a
                    href="/admin/notificacoes"
                    class="nav-item"
                    th:classappend="${activeMenu == 'notificacoes'} ? ' ativo'"
                >
                    <i class="fa-solid fa-envelope-open-text"></i> Notificações
                </a>
                <a
                    href="/admin/reportes"
                    class="nav-item"
                    th:classappend="${activeMenu == 'reportes'} ? ' ativo'"
                >
                    <i class="fa-solid fa-envelope"></i> Reportes
                </a>
                <a
                    href="/admin/audit"
                    class="nav-item"
                    th:classappend="${activeMenu == 'auditoria'} ? ' ativo'"
                >
                    <i class="fa-solid fa-shield-halved"></i> Auditoria
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" onclick="confirmarSairAdmin(); return false;" class="nav-item nav-sair">
                    <i class="fa-solid fa-right-from-bracket"></i> Sair
                </a>
            </div>

            <!-- Modal de confirmação de logout admin — dentro do fragment para ser incluído via th:replace -->
            <div id="modalSairAdmin" style="display:none;position:fixed;
                inset:0;background:rgba(0,0,0,0.5);z-index:9999;
                align-items:center;justify-content:center;">
                <div style="background:#fff;border-radius:12px;padding:2rem;
                    max-width:400px;width:90%;
                    box-shadow:0 8px 32px rgba(0,0,0,0.2);">
                    <h3 style="margin:0 0 0.75rem;
                        font-family:'Playfair Display',serif;font-size:1.2rem;
                        color:#2c241b;">Sair do painel</h3>
                    <p style="margin:0 0 1.5rem;font-size:0.9rem;
                        color:#5a4f47;line-height:1.6;">
                        Tem certeza que deseja sair do painel administrativo?
                    </p>
                    <div style="display:flex;gap:0.75rem;justify-content:flex-end;">
                        <button onclick="document.getElementById('modalSairAdmin').style.display='none'"
                            style="padding:0.5rem 1.25rem;
                            border:1.5px solid #e0d9d0;border-radius:8px;
                            background:#fff;color:#7a6e65;
                            font-size:0.9rem;cursor:pointer;font-weight:500;">
                            Cancelar
                        </button>
                        <button onclick="window.location.href='/admin/sair'"
                            style="padding:0.5rem 1.25rem;border:none;
                            border-radius:8px;background:#722f37;color:#fff;
                            font-size:0.9rem;cursor:pointer;font-weight:600;">
                            Sim, sair
                        </button>
                    </div>
                </div>
            </div>

            <script>
                function confirmarSairAdmin() {
                    var modal = document.getElementById('modalSairAdmin');
                    modal.style.display = 'flex';
                    modal.onclick = function(e) {
                        if (e.target === modal) modal.style.display = 'none';
                    };
                }
            </script>

            <!-- Ícone de Reportes com badge — fixo no canto superior direito -->
            <a href="/admin/reportes" id="btnReportesBadge"
                title="Reportes de problema"
                style="position:fixed;top:1rem;right:4.5rem;
                width:36px;height:36px;border-radius:50%;
                background:#f9f6f0;border:1.5px solid #e0d9d0;
                display:flex;align-items:center;justify-content:center;
                box-shadow:0 2px 8px rgba(0,0,0,0.10);
                cursor:pointer;z-index:997;text-decoration:none;color:#722f37;"
                onmouseover="this.style.background='#722f37';this.style.color='#fff'"
                onmouseout="this.style.background='#f9f6f0';this.style.color='#722f37'">
                <i class="fa-solid fa-envelope" style="font-size:15px;"></i>
            </a>

        <!-- Botão flutuante de logout admin -->
            <a href="#" onclick="confirmarSairAdmin(); return false;"
                id="btnSairFlutuanteAdmin"
                title="Sair do painel"
                style="position:fixed;bottom:1.5rem;right:1.5rem;
                width:40px;height:40px;border-radius:50%;
                background:#fff;border:1.5px solid #e0d9d0;
                display:flex;align-items:center;justify-content:center;
                box-shadow:0 2px 8px rgba(0,0,0,0.12);
                cursor:pointer;z-index:998;
                transition:all 0.2s;text-decoration:none;color:#722f37;"
                onmouseover="this.style.background='#722f37';this.style.color='#fff';this.style.borderColor='#722f37'"
                onmouseout="this.style.background='#fff';this.style.color='#722f37';this.style.borderColor='#e0d9d0'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </a>
        </aside>

        <script>
            (function () {
                function atualizarBadge() {
                    fetch("/api/admin/cancelamentos/pendentes/count", {
                        credentials: "include",
                    })
                        .then(function (r) {
                            return r.ok ? r.json() : null;
                        })
                        .then(function (n) {
                            var el = document.getElementById("badgeCancelamentos");
                            if (!el) return;
                            if (n && n > 0) {
                                el.textContent = n;
                                el.style.display = "inline-block";
                            } else {
                                el.style.display = "none";
                            }
                        })
                        .catch(function () {});
                }
                // Só busca fora da própria página de cancelamentos (que já limpa ao carregar)
                if (!window.location.pathname.startsWith("/admin/cancelamentos")) {
                    atualizarBadge();
                    setInterval(atualizarBadge, 30000);
                }
            })();
        </script>


        <!-- Page Loader global — disponível em todas as páginas admin -->
        <th:block th:replace="~{fragments/loader :: loader}"></th:block>
    </body>
</html>
