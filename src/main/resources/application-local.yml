spring:
  application:
    name: PFC_Projeto
  config:
    import: "optional:file:local.properties"

  jackson:
    serialization:
      write-dates-as-timestamps: false

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false

  datasource:
    url: jdbc:sqlite:user.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    show-sql: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8443
  ssl:
    enabled: true
    key-store: ${SSL_KEYSTORE_PATH}
    key-store-type: PKCS12
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-alias: ${SSL_KEY_ALIAS}

  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false
    path: /error

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  cookie:
    name: token
    secure: false
    samesite: Lax

app:
  allowed-origin: ${APP_ALLOWED_ORIGIN}
  base-url: ${APP_BASE_URL}

mail:
  from: ${MAIL_FROM}

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN}

google:
  books:
    api-key: ${GOOGLE_BOOKS_API_KEY}

logging:
  level:
    root: WARN
    umc:
      exs: INFO

gamificacao:
  xp:
    livro-aprovado: 50
    compra: 30
    avaliacao: 10
    cupom-threshold: 500

ADMIN:
  EMAIL: admin@admin.com
  PASSWORD: admin123