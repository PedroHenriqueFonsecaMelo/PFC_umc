# ===============================
# 📋 CÓPIA DE REFERÊNCIA — NÃO USAR EM PRODUÇÃO
# Todas as chaves sensíveis devem ser fornecidas via variáveis de ambiente.
# ===============================
spring.application.name=PFC_Projeto
server.servlet.context-path=/
server.port=${PORT:8443}

server.ssl.enabled=true
server.ssl.key-store=classpath:certs/keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-alias=UMC_PFC

spring.datasource.url=${DATABASE_URL_JDBC}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.cookie.name=token

app.allowed-origin=${ALLOWED_ORIGIN}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.base-url=${APP_BASE_URL}

logging.level.root=WARN
logging.level.umc.exs=INFO
server.error.include-stacktrace=never
server.error.include-message=never

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
