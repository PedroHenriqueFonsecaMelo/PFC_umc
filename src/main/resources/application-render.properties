# ===============================
# 📦 Application Configuration
# ===============================
spring.application.name=Salt_PedroHenriqueFonsecaMelo
server.servlet.context-path=/

# Render define a porta AUTOMATICAMENTE
server.port=${PORT}

# ===============================
# 🗄️ Database Configuration (RENDER)
# ===============================
spring.datasource.url=${DATABASE_URL_JDBC}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Em PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# 🔐 JWT Security Configuration
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.cookie.name=token

# ===============================
# 📧 Email Configuration (SMTP Render)
# ===============================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===============================
# 🧾 Logging Configuration
# ===============================
logging.file.name=./logs/application.log
logging.level.root=WARN
logging.level.umc.exs=INFO
