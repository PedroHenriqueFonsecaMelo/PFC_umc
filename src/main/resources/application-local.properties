# ===============================
# 📦 Application Configuration
# ===============================
spring.application.name=Salt_PedroHenriqueFonsecaMelo
server.servlet.context-path=/

# Porta e SSL local
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:certs/keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=123456789
server.ssl.key-alias=UMC_PFC


# ===============================
# 🗄️ Database Configuration (SQLite)
# ===============================
spring.datasource.url=jdbc:sqlite:user.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# 1. Hibernate: 'update' mantém seus dados e apenas cria o que falta.
# Se quiser resetar o banco toda vez, mude para 'create'.
spring.jpa.hibernate.ddl-auto=update

# 2. Inicialização de Dados (Scripts SQL)
# 'ALWAYS' diz para o Spring sempre procurar os scripts ao iniciar.
spring.sql.init.mode=ALWAYS

# O SEGREDO: 'false' impede o erro caso o arquivo 'import-test.sql' não exista.
spring.sql.init.fail-on-missing-locations=false

# Se houver erro de sintaxe no SQL (ex: insert duplicado), o app continua rodando.
spring.sql.init.continue-on-error=true

# Local do seu script (certifique-se de que o nome está correto)
spring.sql.init.data-locations=classpath:import-test.sql

# Garante que o script rode APÓS o Hibernate criar as tabelas
spring.jpa.defer-datasource-initialization=true

# 3. Dialeto e Logs
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.show-sql=true

# ===============================
# ⚙️ JPA / Hibernate Configuration
# ===============================
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update


# ===============================
# 🧾 Logging Configuration
# ===============================
logging.file.name=./logs/application.log
logging.level.root=WARN
logging.level.umc.exs=INFO
logging.level.umc.exs.security=DEBUG
logging.level.umc.exs.controller=DEBUG
logging.level.umc.exs.backstage.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.security=DEBUG

# ===============================
# ❌ Error Handling
# ===============================
server.error.include-stacktrace=never
server.error.include-message=never

