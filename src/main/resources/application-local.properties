# ===============================
# 📦 Application Configuration
# ===============================
spring.application.name=PFC_Projeto
server.servlet.context-path=/

# Porta e SSL local
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:certs/keystore.p12
server.ssl.key-store-type=PKCS12
# ⚠️ SEGURANÇA: externalize via variável de ambiente em produção
# Exemplo: export SSL_KEYSTORE_PASSWORD=sua_senha
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:123456789}
server.ssl.key-alias=UMC_PFC

# ===============================
# 🗄️ Database Configuration (SQLite)
# ===============================
spring.datasource.url=jdbc:sqlite:user.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.sql.init.fail-on-missing-locations=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# ⚠️ SEGURANÇA: desabilitar em produção — expõe queries nos logs
spring.jpa.show-sql=false
# Desabilita open-in-view — evita queries durante renderização da view e LazyLoadingException
spring.jpa.open-in-view=false

# ===============================
# 🧾 Logging Configuration
# ===============================
logging.file.name=./logs/application.log
logging.level.root=WARN
logging.level.umc.exs=INFO
# ⚠️ SEGURANÇA: DEBUG em security expõe tokens nos logs — use INFO em produção
logging.level.umc.exs.security=INFO
logging.level.umc.exs.controller=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

# ===============================
# ❌ Error Handling
# ===============================
server.error.include-stacktrace=never
server.error.include-message=never

# ===============================
# 🔐 JWT Security Configuration
# ⚠️ SEGURANÇA: NUNCA commite jwt.secret em texto claro no repositório.
#    Use variável de ambiente: export JWT_SECRET=sua_chave_de_64_chars_ou_mais
# ===============================
jwt.secret=${JWT_SECRET:troque-esta-chave-antes-de-subir-para-producao-minimo-64-chars}
jwt.expiration=86400000
jwt.cookie.name=token

# ===============================
# 🌐 CORS
# ===============================
app.allowed-origin=${ALLOWED_ORIGIN:https://localhost:8443}

# ===============================
# 📧 Email Configuration (LOCAL)
# ===============================
app.base-url=https://localhost:8443
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=no-reply@suaaplicacao.com

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# ☕ JVM — Java 21+ com SQLite
# ===============================
# Suprime o warning de acesso nativo do sqlite-jdbc no Java 21+
# Equivalente a: java --enable-native-access=ALL-UNNAMED -jar app.jar
spring.devtools.restart.additional-paths=src/main/java
