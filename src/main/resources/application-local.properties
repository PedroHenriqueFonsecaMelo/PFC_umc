# ===============================
# 📦 Application Configuration
# ===============================
spring.application.name=PFC_Projeto
server.servlet.context-path=/

# Porta e SSL local
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:certs/keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=123456789
server.ssl.key-alias=UMC_PFC


# ===============================
# 🗄️ Database Configuration (SQLite)
# ===============================
spring.datasource.url=jdbc:sqlite:user.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate cria ou atualiza tabelas sem apagar dados
spring.jpa.hibernate.ddl-auto=update

# Executa schema.sql ou data.sql se existirem
spring.sql.init.mode=always

# Se não existir data.sql, NÃO quebra
spring.sql.init.fail-on-missing-locations=false

# Garante que o script rode depois do Hibernate
spring.jpa.defer-datasource-initialization=true

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.show-sql=true


# ===============================
# 🧾 Logging Configuration
# ===============================
logging.file.name=./logs/application.log
logging.level.root=WARN
logging.level.umc.exs=INFO
logging.level.umc.exs.security=DEBUG
logging.level.umc.exs.controller=DEBUG
logging.level.umc.exs.backstage.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.security=DEBUG


# ===============================
# ❌ Error Handling
# ===============================
server.error.include-stacktrace=never
server.error.include-message=never


# ===============================
# 🔐 JWT Security Configuration
# ===============================
security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
security.jwt.expiration-time=3600000
jwt.secret=sua_chave_secreta_muito_longa_pelo_menos_32_caracteres
jwt.expiration=86400000
jwt.cookie.name=token


# ===============================
# 📧 Email Configuration (LOCAL)
# ===============================
app.base-url=https://localhost:8443

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

mail.from=no-reply@suaaplicacao.com

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB