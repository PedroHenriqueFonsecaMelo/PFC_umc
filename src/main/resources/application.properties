# ==========================================================
# PORTA DA APLICAÇÃO
# No Render, a porta correta vem da variável PORT
# Localmente, se PORT não existir, usa 8443
# ==========================================================
server.port=${PORT:8443}


# ==========================================================
# CONFIGURAÇÃO DO BANCO DE DADOS POSTGRESQL (Render)
# Os valores vêm do painel do Render como variáveis de ambiente
# DATABASE_URL_JDBC → versão JDBC da Internal URL
# ==========================================================
spring.datasource.url=${DATABASE_URL_JDBC}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================================
# JPA / HIBERNATE
# Modo tradicional de uso — simples e direto
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ==========================================================
# CONFIGURAÇÃO DO JWT (usa as variáveis do Render)
# ==========================================================
jwt.secret=${JWT_SECRET}
jwt.validity-ms=${JWT_VALIDITY_MS:86400000}


