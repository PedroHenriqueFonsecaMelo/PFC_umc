# ===============================
# 📦 Application Configuration
# ===============================
spring.application.name=Salt_PedroHenriqueFonsecaMelo
server.servlet.context-path=/


# ===============================
# 🗄️ Database Configuration
# ===============================
spring.datasource.url=jdbc:sqlite:user.db
spring.datasource.driver-class-name=org.sqlite.JDBC


# ===============================
# ⚙️ JPA / Hibernate Configuration
# ===============================
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update


# ===============================
# 🧾 Logging Configuration
# ===============================

# Loga mensagens de WARN e ERROR (inclui Catalina/Tomcat) e salva em arquivo
logging.file.name=./logs/application.log
logging.level.root=WARN

# Logging geral do pacote principal
logging.level.umc.exs=INFO

# Logging por pacotes específicos
logging.level.umc.exs.security=DEBUG
logging.level.umc.exs.controller=DEBUG
logging.level.umc.exs.backstage.security=DEBUG

# Hibernate SQL e Bind Parameters
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Spring Security logging
logging.level.org.springframework.security=DEBUG


# ===============================
# ❌ Error Handling (UX/Security)
# ===============================

# Oculta detalhes do erro no retorno ao cliente
server.error.include-stacktrace=never
server.error.include-message=never


# ===============================
# 🔐 JWT Security Configuration
# ===============================

# ⚠️ Em produção substitua por variáveis de ambiente
security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
security.jwt.expiration-time=3600000   # 1h em ms

# Configuração adicional de JWT
jwt.secret=sua_chave_secreta_muito_longa_pelo_menos_32_caracteres
jwt.expiration=86400000                 # 24h em ms
jwt.cookie.name=token


# ===============================
# 🔒 SSL / HTTPS Configuration
# ===============================

# Ativa HTTPS
server.ssl.enabled=true

# Porta HTTPS
server.port=8443

# Caminho do keystore
server.ssl.key-store=classpath:certs/keystore.p12

# Tipo do keystore
server.ssl.key-store-type=PKCS12

# Senha do keystore (troque para produção!)
server.ssl.key-store-password=123456789

# Alias da chave
server.ssl.key-alias=UMC_PFC

# ===============================
# 📧 Email Configuration (SMTP)
# ===============================

# Servidor SMTP — exemplo: Gmail
spring.mail.host=smtp.gmail.com

# Porta padrão para SMTP + STARTTLS
spring.mail.port=587

# Credenciais da conta que enviará emails
spring.mail.username=SEU_EMAIL_AQUI@gmail.com
spring.mail.password=SUA_SENHA_DE_APLICACAO

# Autenticação e criptografia
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Timeouts recomendados (em ms)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

