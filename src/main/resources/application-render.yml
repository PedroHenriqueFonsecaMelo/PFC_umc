# ===============================
# 📦 Application Configuration (Render)
# ===============================
spring:
  application:
    name: PFC_Projeto
  jmx:
    enabled: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false

  # ===============================
  # 🗄️ Database (Render PostgreSQL)
  # ===============================
  datasource:
    url: "${DATABASE_URL_JDBC}"
    username: "${DATABASE_USERNAME}"
    password: "${DATABASE_PASSWORD}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true
    properties:
      hibernate:
        "[jakarta.persistence.validation.mode]": none
        "[hibernate.validator.apply_to_ddl]": false
        boot:
          "[allow_jdbc_metadata_access]": true
    open-in-view: false
    show-sql: false

  # ===============================
  # 📧 Email
  # ===============================
  mail:
    host: "${MAIL_HOST}"
    port: 465
    username: "${MAIL_USERNAME}"
    password: "${MAIL_PASSWORD}"
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            trust: smtp.gmail.com
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

mail:
  from: ${MAIL_FROM}
# ===============================
# 🌐 Server (Render)
# ===============================
server:
  port: "${PORT:8080}"

  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false
    path: /error

# ===============================
# 🔐 JWT
# ===============================
jwt:
  secret: "${JWT_SECRET}"
  expiration: "${JWT_EXPIRATION}"
  cookie:
    name: token

# ===============================
# 🌍 App config
# ===============================
app:
  base-url: "${APP_BASE_URL:http://localhost:8080}"
  seed:
    mode: stress

# ===============================
# 💠 Gamificação — XP por ação
# ===============================
gamificacao:
  xp:
    livro-aprovado: 50
    compra: 30
    avaliacao: 10
    cupom-threshold: 500

# ===============================
# 🧾 Mercado Pago
# ===============================
mercadopago:
  access-token: "${MERCADOPAGO_ACCESS_TOKEN}"

# ===============================
# 🔎 Google Books
# ===============================
google:
  books:
    api-key: "${GOOGLE_BOOKS_API_KEY}"

# ===============================
# 🧾 Logging
# ===============================
logging:
  file:
    name: "./logs/application.log"
  level:
    root: WARN
    umc:
      exs: INFO

# ===============================
# 🧾 Admin
# ===============================
ADMIN:
  EMAIL: "${ADMIN_EMAIL}"
  PASSWORD: "${ADMIN_PASSWORD}"