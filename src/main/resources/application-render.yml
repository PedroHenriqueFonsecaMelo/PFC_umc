# ===============================
# 📦 Application Configuration (Render)
# ===============================
spring:
  application:
    name: PFC_Projeto
  jmx:
    enabled: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false

  # ===============================
  # 🗄️ Database (Render PostgreSQL)
  # ===============================
  datasource:
    url: "${DATABASE_URL_JDBC}"
    username: "${DATABASE_USERNAME}"
    password: "${DATABASE_PASSWORD}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: false
    properties:
      hibernate:
        default_schema: public
        "[jakarta.persistence.validation.mode]": none
        "[hibernate.validator.apply_to_ddl]": false
        boot:
          "[allow_jdbc_metadata_access]": false
    open-in-view: false
    show-sql: false

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

# ===============================
# 🌐 Server (Render)
# ===============================
server:
  port: "${PORT:8080}"

  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false
    path: /error

# ===============================
# 🔐 JWT
# ===============================
jwt:
  secret: "${JWT_SECRET}"
  expiration: "${JWT_EXPIRATION}"
  cookie:
    name: token
    secure: true
    samesite: Strict


# ===============================
# 🌍 App config
# ===============================
app:
  base-url: "${APP_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}"
  seed:
    mode: stress

# ===============================
# 💠 Gamificação — XP por ação
# ===============================
gamificacao:
  xp:
    livro-aprovado: 50
    compra: 30
    avaliacao: 10
    cupom-threshold: 500

# ===============================
# 🧾 Mercado Pago
# ===============================
mercadopago:
  access-token: "${MERCADOPAGO_ACCESS_TOKEN}"

# ===============================
# 🔎 Google Books
# ===============================
google:
  books:
    api-key: "${GOOGLE_BOOKS_API_KEY}"

# ===============================
# 🧾 Logging
# ===============================
logging:
  file:
    name: "./logs/application.log"
  level:
    root: WARN
    org.springframework.boot: INFO
    umc:
      exs: INFO

# ===============================
# 🧾 Admin
# ===============================
ADMIN:
  EMAIL: "${ADMIN_EMAIL}"
  PASSWORD: "${ADMIN_PASSWORD}"

# ===============================
# 📧 Gmail API Configuration
# ===============================
gmail:
  api:
    credentials-base64: "${GOOGLE_CREDENTIALS_BASE64}"
    GMAIL_REFRESH_TOKEN: "${GMAIL_REFRESH_TOKEN}"