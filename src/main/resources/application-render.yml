# ===============================
# 📦 Application Configuration (Render)
# ===============================
spring:
  application:
    name: PFC_Projeto

  jackson:
    serialization:
      write-dates-as-timestamps: false

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false

  # ===============================
  # 🗄️ Database (Render PostgreSQL)
  # ===============================
  datasource:
    url: "${DATABASE_URL_JDBC}"
    username: "${DATABASE_USERNAME}"
    password: "${DATABASE_PASSWORD}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        temp:
          use_jdbc_metadata_defaults: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: false

  # ===============================
  # 📧 Email
  # ===============================
  mail:
    host: "${MAIL_HOST}"
    port: "${MAIL_PORT}"
    username: "${MAIL_USERNAME}"
    password: "${MAIL_PASSWORD}"
    from: "${MAIL_FROM}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: smtp.gmail.com

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB



# ===============================
# 🌐 Server (Render)
# ===============================
server:
  port: "${PORT}"

  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false
    path: /error

# ===============================
# 🔐 JWT
# ===============================
jwt:
  secret: "${JWT_SECRET}"
  expiration: "${JWT_EXPIRATION}"
  cookie:
    name: token

# ===============================
# 🌍 App config
# ===============================
app:
  base-url: "${APP_BASE_URL}"
  allowed-origin: "${APP_ALLOWED_ORIGIN}"
  seed:
    mode: stress

# ===============================
# 💠 Gamificação — XP por ação
# ===============================
gamificacao:
  xp:
    livro-aprovado: 50
    compra: 30
    avaliacao: 10
    cupom-threshold: 500

# ===============================
# 🧾 Mercado Pago
# ===============================
mercadopago:
  access-token: "${MERCADOPAGO_ACCESS_TOKEN}"

# ===============================
# 🔎 Google Books
# ===============================
google:
  books:
    api-key: "${GOOGLE_BOOKS_API_KEY}"

# ===============================
# 🧾 Logging
# ===============================
logging:
  file:
    name: "./logs/application.log"
  level:
    root: WARN
    umc:
      exs: INFO
